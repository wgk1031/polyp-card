<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#faf7f6;--card:#fff;--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;--pri:#7f1d1d;--pri-d:#641414;--pri-l:#fee2e2;--red:#b42318;--amb:#a15c07;--grn:#166534;--r:12px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 10px}
.top h1{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.top h1 small{font-weight:400;font-size:12px;opacity:.85}
.bk{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bk .btn{background:#fff;color:var(--pri);border-color:#fff;min-height:40px}
main{max-width:880px;margin:0 auto;padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}.card h3{font-size:14px;margin:12px 0 6px;color:var(--mut)}
.fld{margin-bottom:10px}.lb{display:block;font-size:13px;color:var(--mut);font-weight:700;margin-bottom:4px}
.req::after{content:" *";color:var(--red)}
input,select{width:100%;min-height:46px;padding:8px 10px;border:1px solid #d6d3d1;border-radius:10px;background:#fff;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 12px;border:1.5px solid #d6d3d1;background:#fff;border-radius:999px;font-weight:700;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn{min-height:46px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font-weight:700;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}.btn.dng{border-color:var(--red);color:var(--red)}.btn.sm{min-height:40px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.note{border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px;border:1px solid}
.n-info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.n-warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.n-bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}.n-ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:var(--pri-l);color:var(--pri);margin:0 4px 4px 0}
.pc{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;text-align:left;width:100%;cursor:pointer}
.pc b{font-size:16px}.pc .m{color:var(--mut);font-size:13px}
.bx{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:end}
.fine{font-size:12px;color:var(--mut)}
details.more{margin-top:8px}details.more>summary{cursor:pointer;font-weight:800;color:var(--mut);min-height:40px;display:flex;align-items:center}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;min-height:52px;border:0;background:#fff;font-weight:800;color:var(--mut);cursor:pointer}
.bnav button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
body.locked .top,body.locked main,body.locked .bnav{display:none!important}
.auth{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#7f1d1d,#451a1a);display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 16px 24px;overflow:auto}
.auth-box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:20px 16px;height:max-content}
.overlay{position:fixed;inset:0;background:rgba(15,10,10,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#1c1917;color:#fff;padding:8px 14px;border-radius:10px;z-index:90;display:none;max-width:90vw}
.toast.show{display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.tbl th,.tbl td{border:1px solid var(--line);padding:4px;text-align:center}
.auto{background:#fff7ed;border-radius:10px;padding:8px 10px;margin-top:8px}
.hide{display:none!important}
</style>
</head>
<body class="locked">
<header class="top"><div>
  <h1><span>萎缩性胃炎与胃早癌采集</span><small id="saveState">载入中…</small></h1>
  <div class="bk">
    <button class="btn" id="topExport" type="button">导出JSON</button>

</div></header>
<main id="main"></main>

<div class="auth hide" id="auth"><div class="auth-box" id="authBox"></div></div>
<div class="overlay" id="dlg"><div class="sheet"><b id="dlgT">修改原因</b><div id="dlgB" style="margin:10px 0"></div><div class="row"><button class="btn" id="dlgNo" type="button">取消</button><button class="btn pri" id="dlgOk" type="button">确定</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
var SCHEMA="0.2.0";
var SITES=[["A1","胃窦小弯"],["A2","胃窦大弯"],["IA","胃角"],["B1","胃体小弯"],["B2","胃体大弯"]];
var ANT=["A1","A2","IA"], COR=["B1","B2"];
var OLGA_M=[["0","I","II","II"],["I","I","II","III"],["II","II","III","IV"],["III","III","IV","IV"]];
var KT=[["0","C-0"],["1","C-1"],["2","C-2"],["3","C-3"],["4","O-1"],["5","O-2"],["6","O-3"]];
var YN=[["0","无"],["1","有"]];
var REASONS=[["1","补充检查信息"],["2","复核图像后更正"],["3","录入错误"],["4","已知病理后修改"],["5","其他"]];
var MORPH={lesion_type:1,loc_zone:1,loc_wall:1,size_long:1,size_short:1,paris:1,paris_mix:1,color:1,ul:1,abe_redness:1,abe_uneven:1,abe_margin:1,me_mode:1,dl:1,mvp:1,msp:1,pred_depth:1,pred_diff:1,fold_change:1,fold_thick:1,rigidity:1,air_change:1,border_wl:1};
var DB2="gastricDbSecure",LS_ENC="gastricDb.enc.v1",LS_AUTH="gastricDb.auth.v1",LS_BK="gastricDb.lastBackup";
var KDF_ITER=300000,IDLE_MS=15*60*1000,APP_OK="gastric-db-ok",APP_NAME="gastric-db";
var idb=null,cache=new Map(),encCache=new Map(),authRec=null,sessKey=null,sessUser="",saveT=null,saveQueue=Promise.resolve();
var TE=new TextEncoder(),TD=new TextDecoder();
var S={view:"list",pid:"",examId:"",lesionId:"",fuId:"",draft:null,q:"",filter:"全部",more:{},bxMore:{}};
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad2(n){return (n<10?"0":"")+n;}
function nowIso(){return new Date().toISOString();}
function ymNow(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function num(v){if(v==null||String(v).trim()==="")return NaN;var n=Number(v);return isFinite(n)?n:NaN;}
function uid(p){return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},2200);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function b64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function cryptoOk(){return !!(window.crypto&&crypto.subtle);}
async function deriveKey(pw,salt,iter){var km=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:iter},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function aesEnc(key,text,aad){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv,additionalData:TE.encode(aad||"")},key,TE.encode(text));return {iv:b64(iv),ct:b64(ct)};}
async function aesDec(key,rec,aad){return TD.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rec.iv),additionalData:TE.encode(aad||"")},key,unb64(rec.ct)));}
function openDB2(){return new Promise(function(res,rej){if(!window.indexedDB)return rej(new Error("no"));var r;try{r=indexedDB.open(DB2,1);}catch(e){return rej(e);}r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains("enc"))d.createObjectStore("enc",{keyPath:"id"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};setTimeout(function(){rej(new Error("timeout"));},4000);});}
function idbGetAll(store){return new Promise(function(res,rej){var q=idb.transaction(store,"readonly").objectStore(store).getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});}
function idbTx(stores,fn){return new Promise(function(res,rej){var tx=idb.transaction(stores,"readwrite");fn(tx);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});}
function enqueue(fn){var p=saveQueue.then(fn,fn);saveQueue=p.then(function(){},function(){});return p;}
async function storageOpen(){var a=null;try{idb=await openDB2();var m=await idbGetAll("meta");a=m.filter(function(x){return x.k==="auth";})[0]||null;}catch(e){idb=null;}var la=null;try{la=JSON.parse(lsGet(LS_AUTH)||"null");}catch(e){}authRec=a||(la&&la.salt?la:null);if(authRec&&!a&&idb){try{await idbTx(["meta"],function(tx){tx.objectStore("meta").put(authRec);});}catch(e){}}if(authRec&&!la)lsSet(LS_AUTH,JSON.stringify(authRec));}
function readLsEnc(){try{var a=JSON.parse(lsGet(LS_ENC)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
function lsWriteEnc(){return lsSet(LS_ENC,JSON.stringify(Array.from(encCache.values())));}
async function encRecord(p){var r=await aesEnc(sessKey,JSON.stringify(p),p.id);return {id:p.id,iv:r.iv,ct:r.ct};}
function dbPut(p){cache.set(p.id,p);return enqueue(async function(){var rec=await encRecord(p);encCache.set(p.id,rec);var ok=lsWriteEnc();if(idb){try{await idbTx(["enc"],function(tx){tx.objectStore("enc").put(rec);});return true;}catch(e){return ok;}}return ok;});}
function touch(p){p.updated_ts=nowIso();p.schema_version=SCHEMA;if(p.id)saveSoon();}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(flushSave,300);var el=$("#saveState");if(el)el.textContent="待保存…";}
async function flushSave(){clearTimeout(saveT);saveT=null;var p=curSaved();if(!p||!sessKey)return;var ok=await dbPut(JSON.parse(JSON.stringify(p)));var el=$("#saveState");if(el)el.textContent=ok?"已保存":"保存失败";}
async function makeAuth(user,pw){var salt=crypto.getRandomValues(new Uint8Array(16));var key=await deriveKey(pw,salt,KDF_ITER);var chk=await aesEnc(key,APP_OK,"check");return {key:key,auth:{k:"auth",v:1,user:user,salt:b64(salt),iter:KDF_ITER,check:chk}};}
async function verifyPw(pw){try{var key=await deriveKey(pw,unb64(authRec.salt),authRec.iter);return (await aesDec(key,authRec.check,"check"))===APP_OK?key:null;}catch(e){return null;}}
async function createAccount(user,pw){var m=await makeAuth(user,pw);if(idb){await idbTx(["enc","meta"],function(tx){tx.objectStore("enc").clear();tx.objectStore("meta").put(m.auth);});}encCache=new Map();cache=new Map();lsWriteEnc();lsSet(LS_AUTH,JSON.stringify(m.auth));authRec=m.auth;sessKey=m.key;sessUser=user;}
async function loginAccount(user,pw){if(!authRec||user!==authRec.user)return {ok:false};var key=await verifyPw(pw);if(!key)return {ok:false};sessKey=key;sessUser=authRec.user;cache=new Map();encCache=new Map();var recs=[];if(idb){try{recs=await idbGetAll("enc");}catch(e){}}var by={};recs.forEach(function(r){by[r.id]=1;});readLsEnc().forEach(function(r){if(r&&r.id&&!by[r.id])recs.push(r);});var bad=0;for(var i=0;i<recs.length;i++){try{var p=normalize(JSON.parse(await aesDec(key,recs[i],recs[i].id)));encCache.set(p.id,{id:recs[i].id,iv:recs[i].iv,ct:recs[i].ct});cache.set(p.id,p);}catch(e){bad++;}}return {ok:true,bad:bad};}
function lockMemory(){sessKey=null;cache=new Map();encCache=new Map();}

function emptyBx(site){return {bx_id:uid("B"),site:site,taken:"1",quality:"1",pieces:"1",hp_dens:"",inflam:"",activity:"",atrophy:"",atrophy_pct:"",im:"",im_pct:"",im_type:"",ppm:"",indefinite_atrophy:"0",dysplasia:"",ecl_hyp:"",second_read:"",pathologist_code:""};}
function emptyTx(){return {tx_id:uid("X"),tx_type:"",tx_ym:"",en_bloc:"",proc_min:"",complication:[],tx_beyond_indic:""};}
function emptyPath(){return {path_id:uid("P"),path_entry_ts:"",path_dx_system:"",path_final_dx:"",path_hist:"",path_diff_dom:"",undiff_mm:"",path_depth:"",sm_um:"",path_size:"",path_ul:"",ly:"",v_inv:"",hm:"",vm:"",sm_undiff:"",path_gross:"",path_bg:"",path_second_read:"",path_blind_pred:""};}
var LOC_SITES=[["cardia","贲门"],["fundus","胃底"],["bodyU","胃体上部"],["bodyM","胃体中部"],["bodyL","胃体下部"],["angle","胃角"],["antrum","胃窦"],["prepylorus","幽门前区"],["remnant","残胃"]];
var WALL_SITES=[["1","小弯"],["2","大弯"],["3","前壁"],["4","后壁"],["5","环周"]];
function migrateLoc(v){if(v==="4"||v==="贲门")return "cardia";if(v==="5"||v==="残胃")return "remnant";return v==null?"":String(v);}
function isLegacyLoc(v){return v==="1"||v==="2"||v==="3"||v==="上"||v==="中"||v==="下";}
function japanZone(v){if(v==="1"||v==="上"||v==="cardia"||v==="fundus"||v==="bodyU")return "U";if(v==="2"||v==="中"||v==="bodyM"||v==="bodyL"||v==="angle")return "M";if(v==="3"||v==="下"||v==="antrum"||v==="prepylorus")return "L";if(v==="remnant"||v==="5"||v==="残胃")return "残胃";return "";}
function locLabel(v){var known=LOC_SITES.filter(function(x){return x[0]===v;})[0];if(known)return known[1];if(v==="1"||v==="上")return "上（日本分区 U）";if(v==="2"||v==="中")return "中（日本分区 M）";if(v==="3"||v==="下")return "下（日本分区 L）";return v?String(v):"";}
function applyLoc(l){if(!l)return;l.loc_zone=migrateLoc(l.loc_zone);l.loc_uml=japanZone(l.loc_zone);}
function locHint(l){var z=japanZone(l.loc_zone);var msg=isLegacyLoc(l.loc_zone)?"原记录为「"+locLabel(l.loc_zone)+"」。请改选具体部位，日本分区仍为 "+z+"。":"日本分区 "+(z||"—");return '<p class="fine">'+esc(msg)+'</p>';}
function emptyLesion(seq){return {lesion_id:uid("L"),lesion_seq:seq,lesion_type:"",lesion_relation_prior:"",detect_mode:"",loc_zone:"",loc_uml:"",loc_wall:"",size_long:"",size_short:"",size_method:"",paris:"",paris_mix:"",color:"",ul:"",abe_redness:"",abe_uneven:"",abe_margin:"",border_wl:"",cliff_edge:"",surf_other:[],fold_change:"",fold_thick:"",rigidity:"",air_change:"",chromo:"",me_mode:"",dl:"",mvp:"",msp:"",dl_clarity:"",wos:"",lbc:"",wga:"",gastritis_like:"",eus:"",pred_depth:"",pred_diff:"",pred_conf:"",bx_les_done:"",bx_les_n:"",bx_les_path:"",bx_les_ym:"",prev_review:"",prev_review_blind:"",img_kept:"",img_types:[],img_id_range:"",pred_lock_ts:"",pred_depth_first:"",pred_diff_first:"",pred_mod_n:0,pred_mod_ts:"",pred_mod_reason:"",tx:emptyTx(),path:emptyPath()};}
function emptyExam(){return {exam_id:uid("E"),exam_seq:1,exam_ym:ymNow(),exam_type:"1",indication:"",mucosal_vis:"",hp_status:"",hp_test:[],hp_test_conf:"",prev_egd_interval:"",kt_type:"",kt_method:"",kyoto_im:"",kyoto_fold:"",kyoto_nodular:"",kyoto_redness:"",map_redness:"",bg_lbc:"",pg1:"",pg2:"",g17:"",ai_ab:"",bx_done:"1",bx_vials:"",img_kept_bg:"",img_id_bg:"",device_brand:"",me_available:"",operator_code:"",operator_years:"",biopsies:SITES.map(function(s){return emptyBx(s[0]);}),lesions:[]};}
function emptyPatient(){var t=nowIso();return {id:"",schema_version:SCHEMA,pid:"",enroll_cohort:"",enroll_ym:ymNow(),age_at_enroll:"",sex:"",gc_family:"",hp_eradication_hx:"",hp_erad_ym:"",smoking:"",alcohol:"",autoimmune_hx:"",exclude_flag:"0",exclude_reason:"",created_ym:ymNow(),updated_ts:t,exams:[],followups:[],audit_log:[]};}
function emptyFu(){return {fu_id:uid("F"),fu_type:"",fu_ym:ymNow(),fu_exam_link:"",fu_lesion_link:"",addl_ln:"",vital_status:"",hp_after:"",next_fu_m:""};}
function normalize(p){p.schema_version=SCHEMA;p.id=p.pid||p.id;p.exams=p.exams||[];p.followups=p.followups||[];p.audit_log=p.audit_log||[];p.exams.forEach(function(e){e.biopsies=e.biopsies||[];e.lesions=e.lesions||[];e.hp_test=e.hp_test||[];SITES.forEach(function(s){if(!e.biopsies.some(function(b){return b.site===s[0];}))e.biopsies.push(emptyBx(s[0]));});e.lesions.forEach(function(l){l.tx=l.tx||emptyTx();l.path=l.path||emptyPath();l.surf_other=l.surf_other||[];l.img_types=l.img_types||[];l.tx.complication=l.tx.complication||[];applyLoc(l);});});return p;}

function pctToG(pct){if(pct<=0)return 0;if(pct<=30)return 1;if(pct<=60)return 2;return 3;}
function bandOf(pct){return pctToG(Number(pct));}
function bxFlag(b){if(!b||b.taken!=="1")return "";function one(g,pct){if(pct===""||pct==null||g===""||g==null)return "miss";return Number(g)===bandOf(pct)?"ok":"bad";}var a=one(b.atrophy,b.atrophy_pct),i=one(b.im,b.im_pct);if(a==="miss"||i==="miss")return "98";if(a==="bad"&&i==="bad")return "3";if(a==="bad")return "1";if(i==="bad")return "2";return "0";}
function qualify(b){return b&&b.taken==="1"&&b.quality==="1"&&b.indefinite_atrophy!=="1";}
function compartment(biopsies,sites,kind){var pts=biopsies.filter(function(b){return sites.indexOf(b.site)>=0&&qualify(b);});if(!pts.length)return null;var pk=kind==="im"?"im_pct":"atrophy_pct",gk=kind==="im"?"im":"atrophy";var all=pts.every(function(b){return b[pk]!==""&&b[pk]!=null;});if(all){var mean=pts.reduce(function(s,b){return s+Number(b[pk]);},0)/pts.length;return {g:pctToG(mean),src:"pct"};}var gs=pts.map(function(b){return b[gk];}).filter(function(x){return x!==""&&x!=null;});if(!gs.length)return null;return {g:Math.round(gs.reduce(function(s,x){return s+Number(x);},0)/gs.length),src:"grade"};}

async function importText(text){var obj;try{obj=JSON.parse(text);}catch(e){toast("不是有效 JSON");return;}if(obj&&obj.encrypted){if(!obj.kdf||!obj.iv||!obj.ct){toast("加密备份格式不正确");return;}try{if(authRec&&obj.kdf.salt===authRec.salt)obj=JSON.parse(await aesDec(sessKey,obj,"backup"));else{var pw=await askLine("解开备份","<p class=\"fine\">这是上传时那台设备的本机解锁密码，不是云账号密码。</p><input type=\"password\" autocomplete=\"current-password\">");if(!pw)return;var k=await deriveKey(pw,unb64(obj.kdf.salt),obj.kdf.iter);obj=JSON.parse(await aesDec(k,obj,"backup"));}}catch(err){toast("无法解密备份，请确认本机密码");return;}}var list=Array.isArray(obj)?obj:(obj.patients||null);if(!list){toast("未找到 patients");return;}var add=0,upd=0,skip=0;for(var i=0;i<list.length;i++){var raw=list[i];if(!raw||!raw.pid){skip++;continue;}var n=normalize(JSON.parse(JSON.stringify(raw)));n.id=n.pid;var c=cache.get(n.pid);if(!c){add++;await dbPut(n);}else if(String(n.updated_ts)>String(c.updated_ts)){upd++;await dbPut(n);}else skip++;}render();toast("导入完成：新增 "+add+"，更新 "+upd+"，跳过 "+skip);}
