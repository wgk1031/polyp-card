<style>
:root{
  --bg:#f4f5fb;--card:#fff;--ink:#1e1b4b;--mut:#64748b;--line:#e2e8f0;
  --pri:#3730a3;--pri-d:#312e81;--pri-l:#e0e7ff;
  --red:#b42318;--red-l:#fdecea;--amb:#a15c07;--amb-l:#fff4e0;--grn:#177245;--grn-l:#e3f6ea;--blu:#1d4ed8;--blu-l:#e8efff;--pur:#6d28d9;--pur-l:#f0e9ff;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px}
.top-in{max-width:1000px;margin:0 auto}
.top h1{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1 small{font-weight:400;font-size:12px;opacity:.85}
.bk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk-b{min-height:44px;background:#fff!important;color:var(--pri)!important;border-color:#fff!important;padding:6px 14px}
.bk-last{font-size:12px;color:#c7d2fe}
#banner{max-width:1000px;margin:10px auto 0;padding:0 14px}
main{max-width:1000px;margin:0 auto;padding:14px 14px calc(168px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.note{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;border:1px solid}
.n-info{background:var(--blu-l);border-color:#c5d5ff;color:#1e3a8a}
.n-warn{background:var(--amb-l);border-color:#f4d9a6;color:#6b3f05}
.n-bad{background:var(--red-l);border-color:#f5c2bd;color:#7a1a12}
.n-ok{background:var(--grn-l);border-color:#b7e3c6;color:#0f5132}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fld{margin-bottom:10px}
.fld label.lb,.lb{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #c3cfda;border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:#64748b}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;min-width:56px;padding:8px 14px;border:1.5px solid #c3cfda;background:#fff;border-radius:999px;cursor:pointer;font-weight:600;color:#33414f}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip:disabled{opacity:.5;cursor:not-allowed}
.sw{display:block;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 12px;border:1.5px solid #c3cfda;border-radius:10px;background:#fff;font-weight:600}
.sw span::before{content:"";flex:none;width:44px;height:26px;border-radius:13px;background:#c5ced6;transition:.15s;background-image:radial-gradient(circle at 13px 13px,#fff 10px,transparent 11px);background-repeat:no-repeat}
.sw input:checked+span{border-color:var(--pri);background:var(--pri-l)}
.sw input:checked+span::before{background-color:var(--pri);background-image:radial-gradient(circle at 31px 13px,#fff 10px,transparent 11px)}
.sw.rd span::before{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #98a6b3;background-image:none}
.sw.rd input:checked+span::before{background:radial-gradient(circle,var(--pri) 45%,#fff 50%);border-color:var(--pri)}
.btn{min-height:50px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font-weight:700;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:active{background:var(--pri-d)}
.btn.dng{border-color:var(--red);color:var(--red)}
.btn.sm{min-height:42px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:30;min-height:58px;padding:0 24px;border-radius:29px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:28;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;min-height:52px;border:0;background:#fff;color:var(--mut);font-weight:700;cursor:pointer}
.bnav button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.stat-n{font-size:28px;font-weight:800;line-height:1.15;color:var(--pri)}
.kvs{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.bar{height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:8px 0}
.bar>span{display:block;height:100%;background:var(--pri)}
.jump{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer;min-height:44px;font-weight:600}
.jump small{display:block;font-weight:500;color:var(--mut)}
.fine{font-size:12px;color:var(--mut);line-height:1.45}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-path{background:var(--amb-l);color:var(--amb)}
.b-lock{background:#eceff3;color:#334}
.b-ok{background:var(--grn-l);color:var(--grn)}
.b-bad{background:var(--red-l);color:var(--red)}
.b-warn{background:var(--amb-l);color:var(--amb)}
.b-seg{background:var(--pri-l);color:var(--pri)}
.pc{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pc-h .t{font-weight:700;font-size:16px}
.pc-h .m{color:var(--mut);font-size:13px}
.pc .meta{font-size:13px;color:var(--mut);margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.auth{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#3730a3,#1e1b4b);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 16px 40px}
.auth-box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.auth-box h2{margin:0 0 4px;font-size:20px}
.auth-err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0 8px}
.auth-logo{font-size:40px;text-align:center}
body.locked .top,body.locked #banner,body.locked main,body.locked .fab,body.locked .bnav{display:none!important}
.linkb{background:none;border:0;color:var(--pri);text-decoration:underline;min-height:44px;cursor:pointer;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h b{font-size:17px}
.sheet-b{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.hide{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1f2933;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw;display:none}
.toast.show{display:block}
details.opt>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--mut)}
.req::after{content:" *";color:var(--red)}
ul.t{padding-left:20px;margin:6px 0}
ul.t li{margin:4px 0}
code{background:#eef2f5;padding:1px 5px;border-radius:4px;font-size:13px}
@media (min-width:900px){.sheet{border-radius:18px;margin:auto}.overlay{align-items:center}}
@media (max-width:720px){
  .top{position:static}
  main{padding:10px 10px calc(168px + env(safe-area-inset-bottom))}
  .grid{grid-template-columns:1fr}
  .fab{left:16px;right:16px}
}
</style>
</head>
<body class="locked">
<header class="top"><div class="top-in">
  <h1><span>多发息肉段内送检课题采集</span><small id="saveState">载入中…</small></h1>
  <div class="bk-row">
    <button class="btn bk-b" id="topExport">⬇ 导出JSON</button>
    <button class="btn bk-b" id="topCsv" type="button">导出 CSV</button>

<script>
"use strict";
/* ===== 常量与数据模型 ===== */
var SEG_OPTS=["升结肠","横结肠","降结肠","乙状结肠"];
var PARIS=["未选","0-Ip","0-Isp","0-Is","0-IIa","0-IIb","0-IIc","0-III","LST-G","LST-NG"];
var NICE_OPTS=["未选","1","2","3","不确定"];
var JNET_OPTS=["未评","1","2A","2B","3"];
var RESECT_OPTS=["未选","冷切","热切","EMR","其他"];
var COMPLETE_OPTS=["未选","是","否","不确定"];
var POS_OPTS=["未填","近口侧","中","近肛侧"];
var CONF_OPTS=["未填","确信","可能","不确定"];
var PATH_TYPE=["待报","腺瘤","SSL","HP","TSA","癌","其他"];
var DYSP_OPTS=["未填","无","低级别","高级别","浸润癌"];
var VILL_CHOICES=[["","未填"],["none","无"],["lt25","<25%"],["ge25","≥25%"]];
var SSL_DYS=["不适用","是","否"];
var MARGIN_OPTS=["未填","累及","未累及","不适用","不详"];
var FILTERS=["全部","待补病理","已锁定"];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad2(n){return (n<10?"0":"")+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function nowIso(){return new Date().toISOString();}
function parseNum(s){if(s===null||s===undefined)return NaN;var t=String(s).trim();if(t==="")return NaN;var n=Number(t);return isFinite(n)?n:NaN;}
var SSL_FLAGS=[["sslMucusCap","粘液帽"],["sslCloudSurface","云雾状表面"],["sslIndistinctBorder","边界不清"],["sslIrregularShape","形态不规则"]];
function emptyPolyp(seq){
  return {id:uid(),seq:seq,bottle:String(seq),sizeMm:"",paris:"未选",redness:false,depressed:false,
    nice:"未选",resection:"未选",completeResection:"未选",retrieved:true,
    jnet:"未评",sslLike:false,sslMucusCap:false,sslCloudSurface:false,sslIndistinctBorder:false,sslIrregularShape:false,
    relativePos:"未填",surfaceErosionUlcer:"none",surfaceNodular:false,opticalConf:"未填",
    pathType:"待报",dysplasia:"未填",villous:"",sslDysplasia:"不适用",margin:"未填",pathDate:""};
}
function emptySegment(){
  var t=nowIso();
  return {id:uid(),caseId:"",examDate:todayStr(),centerCode:"",operatorCode:"",segment:"升结肠",
    plannedCount:"",note:"",locked:false,polyps:[],createdAt:t,updatedAt:t};
}
function inGoldStandard(p){
  if(p.retrieved===false)return false;
  if(p.completeResection==="否")return false;
  return true;
}
function pathPending(p){return !p.pathType||p.pathType==="待报";}
function segmentNeedsPath(seg){
  return (seg.polyps||[]).some(function(p){return inGoldStandard(p)&&pathPending(p);});
}
function countMismatch(seg){
  var plan=parseNum(seg.plannedCount);
  if(isNaN(plan))return null;
  var n=(seg.polyps||[]).length;
  return plan!==n?{plan:plan,n:n}:null;
}

/* ===== 加密持久化：命名空间与息肉卡隔离 ===== */
var DB2="segmentStudySecure",LS_ENC="segmentStudy.enc.v1",LS_AUTH="segmentStudy.auth.v1";
var LS_BK="segmentStudy.lastBackup",LS_DEV="segmentStudy.device";
var KDF_ITER=300000,IDLE_MS=15*60*1000,APP_OK="segment-study-ok",APP_NAME="segment-study-card";
var idb=null,backendName="localStorage",cache=new Map(),encCache=new Map(),authRec=null,sessKey=null,sessUser="";
var TE=new TextEncoder(),TD=new TextDecoder();
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function b64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function cryptoOk(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues);}
async function deriveKey(pw,salt,iter){
  var km=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:iter},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function aesEnc(key,text,aad){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv,additionalData:TE.encode(aad||"")},key,TE.encode(text));return {iv:b64(iv),ct:b64(ct)};}
async function aesDec(key,rec,aad){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rec.iv),additionalData:TE.encode(aad||"")},key,unb64(rec.ct));return TD.decode(pt);}

function needsSeparate(p){return !!p&&(p.surfaceErosionUlcer==="erosion"||p.surfaceErosionUlcer==="ulcer");}
function waspCountOf(p){var n=0;SSL_FLAGS.forEach(function(it){if(p&&p[it[0]])n++;});return n;}
function clearSslFlags(o){SSL_FLAGS.forEach(function(it){o[it[0]]=false;});}
function ulcerLegacyTruthy(v){
  return !(v===undefined||v===null||v===false||v===0||v===""||v==="0"||v==="否"||v==="false"||v==="无"||v==="none");
}
/* 旧「溃疡/白苔或明显结节」是单一是否。能识别的字符串才迁入新字段；单纯「是」无法区分，保留原字段。 */
function applyUlcerMigration(raw,o){
  if(!raw||!ulcerLegacyTruthy(raw.ulcerNodule))return;
  var v=raw.ulcerNodule;
  if(v===true||v===1||v==="1"||v==="是"||v==="true"){o.ulcerNodule=true;return;}
  if(typeof v!=="string"){o.ulcerNodule=v;return;}
  var s=v.trim();if(!s)return;
  var mapped=false;
  if(/结节|颗粒/.test(s)){o.surfaceNodular=true;mapped=true;}
  if(/糜烂/.test(s)){if(o.surfaceErosionUlcer==="none")o.surfaceErosionUlcer="erosion";mapped=true;}
  else if(/溃疡|白苔/.test(s)){if(o.surfaceErosionUlcer==="none")o.surfaceErosionUlcer="ulcer";mapped=true;}
  if(!mapped)o.ulcerNodule=v;
}
/* 旧绒毛「无」→ none；「有」无法区分比例，原样保留。未填保存为空字符串。 */
function normVillous(v){
  if(v==null)return "";
  v=String(v).trim();
  if(v===""||v==="未填")return "";
  if(v==="无")return "none";
  return v;
}
function villousNeedsChoice(p){
  var v=p&&p.villous;
  return v==="有"||(v&&v!=="none"&&v!=="lt25"&&v!=="ge25");
}
function villousSelect(cur){
  var known=false;
  var html=VILL_CHOICES.map(function(it){
    if(cur===it[0])known=true;
    return '<option value="'+esc(it[0])+'"'+(cur===it[0]?" selected":"")+'>'+esc(it[1])+'</option>';
  }).join("");
  if(!known)html+='<option value="'+esc(cur)+'" selected>'+esc(cur==="有"?"有（请补选）":String(cur))+'</option>';
  return html;
}
function normPolyp(p){var d=emptyPolyp(1),o={};for(var k in d)o[k]=(p&&p[k]!==undefined&&p[k]!==null)?p[k]:d[k];
  if(typeof o.id!=="string"||!o.id)o.id=uid();
  ["redness","depressed","sslLike","retrieved","surfaceNodular"].concat(SSL_FLAGS.map(function(it){return it[0];})).forEach(function(k){o[k]=!!o[k];});
  ["bottle","sizeMm","pathDate"].forEach(function(k){o[k]=String(o[k]==null?"":o[k]);});
  o.seq=parseInt(o.seq,10);if(!(o.seq>0))o.seq=1;
  if(o.surfaceErosionUlcer!=="erosion"&&o.surfaceErosionUlcer!=="ulcer")o.surfaceErosionUlcer="none";
  o.villous=normVillous(o.villous);
  applyUlcerMigration(p,o);
  if(!o.sslLike)clearSslFlags(o);
  return o;}
function normSegment(p){var d=emptySegment(),o={};for(var k in d)o[k]=(p&&p[k]!==undefined&&p[k]!==null)?p[k]:d[k];
  if(typeof o.id!=="string"||!o.id)o.id=uid();
  o.locked=!!o.locked;
  ["caseId","examDate","centerCode","operatorCode","plannedCount","note"].forEach(function(k){o[k]=String(o[k]==null?"":o[k]);});
  if(SEG_OPTS.indexOf(o.segment)<0)o.segment="升结肠";
  o.polyps=Array.isArray(p&&p.polyps)?p.polyps.map(normPolyp):[];
  if(isNaN(Date.parse(o.createdAt)))o.createdAt=nowIso();
  if(isNaN(Date.parse(o.updatedAt)))o.updatedAt=o.createdAt;
  return o;}
function newer(a,b){return Date.parse(a.updatedAt)>Date.parse(b.updatedAt);}

function openDB2(){return new Promise(function(res,rej){
  if(!window.indexedDB)return rej(new Error("no indexedDB"));
  var r;try{r=indexedDB.open(DB2,1);}catch(e){return rej(e);}
  r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains("enc"))d.createObjectStore("enc",{keyPath:"id"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
  setTimeout(function(){rej(new Error("idb timeout"));},4000);
});}
function idbGetAll(store){return new Promise(function(res,rej){var q=idb.transaction(store,"readonly").objectStore(store).getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});}
function idbTx(stores,fn){return new Promise(function(res,rej){var tx=idb.transaction(stores,"readwrite");fn(tx);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};});}
function readLsAuth(){try{var a=JSON.parse(lsGet(LS_AUTH)||"null");return a&&a.salt&&a.check?a:null;}catch(e){return null;}}
function readLsEnc(){try{var a=JSON.parse(lsGet(LS_ENC)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
function lsWriteEnc(){return lsSet(LS_ENC,JSON.stringify(Array.from(encCache.values())));}

async function storageOpen(){
  var a=null;
  try{idb=await openDB2();backendName="IndexedDB（加密）+ localStorage 加密镜像";var m=await idbGetAll("meta");a=m.filter(function(x){return x.k==="auth";})[0]||null;}
  catch(e){idb=null;backendName="localStorage 加密镜像（IndexedDB 不可用）";}
  var la=readLsAuth();authRec=a||la||null;
  if(authRec&&!a&&idb){try{await idbTx(["meta"],function(tx){tx.objectStore("meta").put(authRec);});}catch(e){}}
  if(authRec&&!la)lsSet(LS_AUTH,JSON.stringify(authRec));
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}

var saveQueue=Promise.resolve();
function enqueue(fn){var p=saveQueue.then(fn,fn);saveQueue=p.then(function(){},function(){});return p;}
async function encRecord(p){var r=await aesEnc(sessKey,JSON.stringify(p),p.id);return {id:p.id,iv:r.iv,ct:r.ct};}
function dbPut(p){cache.set(p.id,p);return enqueue(async function(){
  var rec=await encRecord(p);encCache.set(p.id,rec);var ok=lsWriteEnc();
  if(idb){try{await idbTx(["enc"],function(tx){tx.objectStore("enc").put(rec);});return true;}catch(e){return ok;}}
  return ok;});}
function dbPutMany(arr){arr.forEach(function(p){cache.set(p.id,p);});return enqueue(async function(){
  var recs=[];for(var i=0;i<arr.length;i++)recs.push(await encRecord(arr[i]));
  recs.forEach(function(r){encCache.set(r.id,r);});var ok=lsWriteEnc();
  if(idb){try{await idbTx(["enc"],function(tx){recs.forEach(function(r){tx.objectStore("enc").put(r);});});return true;}catch(e){return ok;}}
  return ok;});}
function dbDelete(id){cache.delete(id);return enqueue(async function(){encCache.delete(id);lsWriteEnc();
  if(idb){try{await idbTx(["enc"],function(tx){tx.objectStore("enc").delete(id);});}catch(e){}}});}

async function makeAuth(user,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var key=await deriveKey(pw,salt,KDF_ITER);
  var chk=await aesEnc(key,APP_OK,"check");
  return {key:key,auth:{k:"auth",v:1,user:user,salt:b64(salt),iter:KDF_ITER,check:chk}};
}
async function verifyPw(pw){
  try{var key=await deriveKey(pw,unb64(authRec.salt),authRec.iter);var t=await aesDec(key,authRec.check,"check");return t===APP_OK?key:null;}catch(e){return null;}
}
async function createAccount(user,pw){
  var m=await makeAuth(user,pw);
  if(idb){await idbTx(["enc","meta"],function(tx){tx.objectStore("enc").clear();tx.objectStore("meta").put(m.auth);});}
  encCache=new Map();cache=new Map();
  if(!lsWriteEnc()||!lsSet(LS_AUTH,JSON.stringify(m.auth))){if(!idb)throw new Error("本机存储不可用，无法保存。");}
  authRec=m.auth;sessKey=m.key;sessUser=user;return 0;
}
async function loginAccount(user,pw){
  if(!authRec||user!==authRec.user)return {ok:false};
  var key=await verifyPw(pw);if(!key)return {ok:false};
  sessKey=key;sessUser=authRec.user;cache=new Map();encCache=new Map();
  var recs=[];if(idb){try{recs=await idbGetAll("enc");}catch(e){recs=[];}}
  var byId={};recs.forEach(function(r){byId[r.id]=true;});
  readLsEnc().forEach(function(r){if(r&&r.id&&!byId[r.id])recs.push(r);});
  var bad=0;
  for(var i=0;i<recs.length;i++){
    try{var p=normSegment(JSON.parse(await aesDec(key,recs[i],recs[i].id)));encCache.set(recs[i].id,{id:recs[i].id,iv:recs[i].iv,ct:recs[i].ct});var c=cache.get(p.id);if(!c||newer(p,c))cache.set(p.id,p);}
    catch(e){bad++;}
  }
  return {ok:true,bad:bad};
}
async function changePassword(oldPw,newPw){
  var okKey=await verifyPw(oldPw);if(!okKey)return "旧密码不正确";
  return enqueue(async function(){
    var m=await makeAuth(authRec.user,newPw);
    var pts=Array.from(cache.values()),recs=[];
    for(var i=0;i<pts.length;i++){var r=await aesEnc(m.key,JSON.stringify(pts[i]),pts[i].id);recs.push({id:pts[i].id,iv:r.iv,ct:r.ct});}
    if(idb){await idbTx(["enc","meta"],function(tx){tx.objectStore("enc").clear();recs.forEach(function(r){tx.objectStore("enc").put(r);});tx.objectStore("meta").put(m.auth);});}
    encCache=new Map();recs.forEach(function(r){encCache.set(r.id,r);});
    lsWriteEnc();lsSet(LS_AUTH,JSON.stringify(m.auth));authRec=m.auth;sessKey=m.key;return null;
  });
}
function lockMemory(){sessKey=null;cache=new Map();encCache=new Map();}
async function clearAllLocal(){
  try{if(idb){idb.close();idb=null;}}catch(e){}
  await new Promise(function(res){try{var r=indexedDB.deleteDatabase(DB2);r.onsuccess=r.onerror=r.onblocked=function(){res();};setTimeout(res,2000);}catch(e){res();}});
  [LS_ENC,LS_AUTH,LS_BK].forEach(lsDel);authRec=null;lockMemory();
}

function buildPolypCsv(segments){
  var lines=[CSV_COLS.map(function(c){return csvCell(c[0]);}).join(",")];
  segments.forEach(function(s){(s.polyps||[]).forEach(function(p){lines.push(CSV_COLS.map(function(c){return csvCell(c[1](s,p));}).join(","));});});
  return "\uFEFF"+lines.join("\r\n");
}

async function decryptBackup(obj){
  if(!obj.kdf||!obj.kdf.salt||!obj.iv||!obj.ct||!(obj.kdf.iter>0&&obj.kdf.iter<=5000000)){alert("导入失败：加密备份格式不正确。");return null;}
  if(authRec&&obj.kdf.salt===authRec.salt){try{var o=JSON.parse(await aesDec(sessKey,obj,"backup"));if(Array.isArray(o.segments))return o.segments;}catch(e){}}
  var pl=null;
  var r=await dialog({title:"输入备份密码",ok:"解密并导入",html:'<p style="margin-top:0">请输入导出该备份时的登录密码。</p>'+pwField("pw","备份密码"),
    collect:function(root){return {pw:dv(root,"pw")};},
    validate:async function(v){if(!v.pw)return "请输入备份密码";
      try{var k=await deriveKey(v.pw,unb64(obj.kdf.salt),obj.kdf.iter);var o=JSON.parse(await aesDec(k,obj,"backup"));if(!Array.isArray(o.segments))return "备份内容不正确";pl=o.segments;return null;}
      catch(e){return "备份密码错误，或文件已损坏";}}});
  return r?pl:null;
}
async function importJsonText(text){
  if(!sessKey)return;
  var obj;try{obj=JSON.parse(text);}catch(e){alert("导入失败：不是有效 JSON。");return;}
  var list;
  if(obj&&obj.encrypted){list=await decryptBackup(obj);if(!list)return;}
  else list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.segments)?obj.segments:null);
  if(!list){alert("导入失败：未找到 segments 数组（应为课题采集工具备份）。");return;}
  if(S.view==="edit"&&saveT)await flushSave();
  var add=0,upd=0,skip=0,bad=0,put=[];
  list.forEach(function(raw){
    if(!raw||typeof raw.id!=="string"||!raw.id||!Array.isArray(raw.polyps)){bad++;return;}
    var n=normSegment(raw),c=cache.get(n.id);
    if(!c){add++;put.push(n);}
    else if(newer(n,c)){upd++;put.push(n);}
    else skip++;
  });
  if(put.length)await dbPutMany(put);
  if(S.view==="edit"&&S.cur&&cache.get(S.cur.id))S.cur=JSON.parse(JSON.stringify(cache.get(S.cur.id)));
  render();
  alert("导入完成：新增 "+add+"，更新 "+upd+"，跳过 "+skip+(bad?"，无效 "+bad:"")+"。");
}

async function doSetup(){
  var u=$("#aUser").value.trim(),p=$("#aPw").value,p2=$("#aPw2").value,err=$("#aErr"),go=$("#aGo");
  if(!u){err.textContent="请输入用户名";return;}if(p.length<6){err.textContent="密码至少 6 位";return;}if(p!==p2){err.textContent="两次密码不一致";return;}
  err.textContent="";go.disabled=true;go.textContent="正在加密…";
  try{await createAccount(u,p);afterUnlock("账号已设置。");}catch(e){err.textContent="设置失败："+(e&&e.message||e);go.disabled=false;go.textContent="设置并进入";}
}
async function doLogin(){
  var now=Date.now(),err=$("#aErr"),go=$("#aGo");
  if(now<blockUntil){err.textContent="请 "+Math.ceil((blockUntil-now)/1000)+" 秒后再试";return;}
  var u=$("#aUser").value.trim(),p=$("#aPw").value;
  if(!u||!p){err.textContent="请输入用户名和密码";return;}
  err.textContent="";go.disabled=true;go.textContent="验证中…";
  var r;try{r=await loginAccount(u,p);}catch(e){r={ok:false};}
  go.disabled=false;go.textContent="登录";
  if(!r.ok){failCount++;if(failCount>=5){blockUntil=Date.now()+30000;failCount=0;err.textContent="连续错误，请 30 秒后再试";}else err.textContent="用户名或密码错误";$("#aPw").value="";return;}
  failCount=0;afterUnlock(r.bad?"有 "+r.bad+" 条无法解密":"");
}
function afterUnlock(note){
  document.body.classList.remove("locked");$("#auth").classList.add("hide");$("#authBox").innerHTML="";
  S.view="list";S.cur=null;S.q="";S.filter="全部";startIdle();
  setSaveState("已就绪 · "+cache.size+" 条 · "+sessUser);render();window.scrollTo(0,0);
  if(note)toast(note);
}
async function lockNow(msg){
  if(!sessKey)return;
  closeSheet();$("#dlg").classList.remove("show");$("#toast").classList.remove("show");
  if(saveT)await flushSave();await saveQueue;
  S.cur=null;S.editPolypId=null;lockMemory();clearInterval(idleTimer);setSaveState("已锁定");
  showAuth("login",msg||"已锁定。");
}
function touchAct(){lastAct=Date.now();}
function checkIdle(){if(sessKey&&Date.now()-lastAct>IDLE_MS)lockNow("空闲超过 15 分钟，已自动锁定。");}
function startIdle(){touchAct();clearInterval(idleTimer);idleTimer=setInterval(checkIdle,3000);}
["pointerdown","keydown","touchstart","input","scroll","click"].forEach(function(ev){document.addEventListener(ev,touchAct,{passive:true,capture:true});});
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkIdle();});

var PATH_DASH=[["HP","增生性"],["腺瘤","腺瘤"],["SSL","SSL"],["TSA","TSA"],["癌","癌"],["其他","其他"]];
function readGoal(){var t=(lsGet(LS_GOAL)||"").trim();if(!t)return null;var n=parseInt(t,10);return n>0?n:null;}
function writeGoal(v){if(v==null||v==="")lsDel(LS_GOAL);else lsSet(LS_GOAL,String(v));}
function statPool(){
  var arr=Array.from(cache.values());
  if(S.statSeg&&S.statSeg!=="全部")arr=arr.filter(function(s){return s.segment===S.statSeg;});
  arr.sort(function(a,b){var d=(a.examDate||"").localeCompare(b.examDate||"");return d||(a.caseId||"").localeCompare(b.caseId||"");});
  return arr;
}
function segLine(s){return (s.caseId||"（未填病例ID）")+" · "+(s.examDate||"—")+" · "+(s.segment||"—");}
/* USMSTF 2020 / ESGE 2020。大小未填、绒毛为「有」或未填时跳过该判据，不因此命中。HP≥10 不并入进展期。 */
function lesionFlags(p){
  var size=parseNum(p&&p.sizeMm),sizeOk=!isNaN(size);
  var cancer=!!p&&(p.pathType==="癌"||p.dysplasia==="浸润癌");
  var advAd=false,advSer=false;
  if(p&&p.pathType==="腺瘤"){
    if(sizeOk&&size>=10)advAd=true;
    if(p.villous==="ge25")advAd=true;
    if(p.dysplasia==="高级别")advAd=true;
  }
  if(p&&p.pathType==="TSA")advSer=true;
  if(p&&p.pathType==="SSL"){
    if(p.sslDysplasia==="是")advSer=true;
    if(sizeOk&&size>=10)advSer=true;
  }
  return {advancedAdenoma:advAd,advancedSerrated:advSer,advancedNeoplasia:!!(advAd||advSer||cancer),hpGe10:!!(p&&p.pathType==="HP"&&sizeOk&&size>=10),cancer:cancer};
}
function dashboardData(segs){
  var by={};SEG_OPTS.forEach(function(name){by[name]=0;});
  var polyps=0,gs=0,gsFilled=0,nonGs=0,advAd=0,advSer=0,cancerN=0,advNeo=0,hp10=0,neoSeg=0;
  var pathCounts={};PATH_DASH.forEach(function(x){pathCounts[x[0]]=0;});
  var pending=[],mismatch=[],nong=[],unlock=[],legacy=[],villousFix=[];
  segs.forEach(function(s){
    if(by[s.segment]!=null)by[s.segment]++;
    var ps=s.polyps||[],gsN=0,gsPend=0,non=0,pendAll=0,segNeo=false;
    polyps+=ps.length;
    ps.forEach(function(p){
      if(pathPending(p))pendAll++;
      if(!inGoldStandard(p))non++;
      else{gsN++;if(pathPending(p))gsPend++;else gsFilled++;}
      if(!pathPending(p)){
        if(pathCounts[p.pathType]==null)pathCounts["其他"]++;
        else pathCounts[p.pathType]++;
      }
      var f=lesionFlags(p);
      if(f.advancedAdenoma)advAd++;
      if(f.advancedSerrated)advSer++;
      if(f.cancer)cancerN++;
      if(f.advancedNeoplasia){advNeo++;segNeo=true;}
      if(f.hpGe10)hp10++;
      if(ulcerLegacyTruthy(p.ulcerNodule))legacy.push({s:s,p:p});
      if(villousNeedsChoice(p))villousFix.push({s:s,p:p});
    });
    if(segNeo)neoSeg++;
    gs+=gsN;nonGs+=non;
    if(gsPend)pending.push(s);
    var mm=countMismatch(s);if(mm)mismatch.push({s:s,mm:mm});
    if(non)nong.push({s:s,n:non});
    if(!s.locked&&ps.length>0&&pendAll===0)unlock.push(s);
  });
  return {n:segs.length,by:by,polyps:polyps,gs:gs,gsFilled:gsFilled,nonGs:nonGs,advAd:advAd,advSer:advSer,cancerN:cancerN,advNeo:advNeo,neoSeg:neoSeg,hp10:hp10,pathCounts:pathCounts,pending:pending,mismatch:mismatch,nong:nong,unlock:unlock,legacy:legacy,villousFix:villousFix};
}
function jumpBtn(s,text,sub,pid){
  return '<button type="button" class="jump" data-sid="'+esc(s.id)+'"'+(pid?' data-pid="'+esc(pid)+'"':'')+'>'+esc(text)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>';
}
function renderStats(){
  if(!sessKey)return;
  $("#fab").classList.add("hide");
  var segs=statPool(),d=dashboardData(segs),goal=readGoal();
  var avg=d.n?(Math.round(d.polyps/d.n*10)/10).toFixed(1):"—";
  var segChips=["全部"].concat(SEG_OPTS).map(function(name){
    return '<button type="button" class="chip'+(S.statSeg===name?" on":"")+'" data-statseg="'+esc(name)+'">'+esc(name)+'</button>';
  }).join("");
  var byHtml=SEG_OPTS.map(function(name){return '<div class="kvs"><span>'+esc(name)+'</span><b>'+d.by[name]+'</b></div>';}).join("");
  var bar="";
  if(goal){
    var pct=Math.max(0,Math.min(100,Math.round(d.n/goal*100)));
    bar='<div class="bar" aria-label="入组进度"><span style="width:'+pct+'%"></span></div><div>已入组 '+d.n+' / 目标 '+goal+(d.n>goal?' · 已超过目标':'')+'</div>';
  }
  var pendHtml=d.pending.length?d.pending.map(function(s){return jumpBtn(s,segLine(s),"待回填金标准病理");}).join(""):'<div class="empty">无</div>';
  var misHtml=d.mismatch.length?d.mismatch.map(function(x){return jumpBtn(x.s,segLine(x.s),"计划 "+x.mm.plan+" ≠ 实录 "+x.mm.n);}).join(""):'<div class="empty">无</div>';
  var nonHtml=d.nong.length?d.nong.map(function(x){return jumpBtn(x.s,segLine(x.s),"不入金标准 "+x.n+" 枚");}).join(""):'<div class="empty">无</div>';
  var unHtml=d.unlock.length?d.unlock.map(function(s){return jumpBtn(s,segLine(s),"病理已全部回填，尚未锁定");}).join(""):'<div class="empty">无</div>';
  var legHtml=d.legacy.length?d.legacy.map(function(x){return jumpBtn(x.s,segLine(x.s),"息肉 #"+x.p.seq+" 旧字段待补选",x.p.id);}).join(""):'<div class="empty">无</div>';
  var vilHtml=d.villousFix.length?d.villousFix.map(function(x){return jumpBtn(x.s,segLine(x.s),"息肉 #"+x.p.seq+" 请补选绒毛比例",x.p.id);}).join(""):'<div class="empty">无</div>';
  var dist=PATH_DASH.map(function(x){return '<div class="kvs"><span>'+esc(x[1])+'</span><b>'+d.pathCounts[x[0]]+'</b></div>';}).join("");
  $("#main").innerHTML=
    '<div class="card"><h2 style="margin-top:0">统计看板</h2><p class="fine" style="margin-top:0">只读。只按本机已解锁的记录计算，随下方肠段筛选变化。</p><div class="filters">'+segChips+'</div></div>'+
    '<div class="card"><h2>入组肠段</h2><div class="stat-n">'+d.n+'</div>'+byHtml+
    '<div class="fld" style="margin-top:12px"><label class="lb">目标段数</label><input type="number" inputmode="numeric" min="1" id="goalIn" placeholder="留空表示不设" value="'+(goal==null?"":goal)+'"></div>'+
    (bar||'<p class="fine">设置目标段数后显示进度（已入组/目标）。</p>')+'</div>'+
    '<div class="card"><h2>息肉</h2><div class="kvs"><span>息肉总数</span><b class="stat-n">'+d.polyps+'</b></div><div class="kvs"><span>每段平均枚数</span><b>'+avg+'</b></div></div>'+
    '<div class="card"><h2>病理回填</h2><div class="stat-n">'+d.gsFilled+' / '+d.gs+'</div><p class="fine">已回填 / 入金标准息肉。不入金标准 '+d.nonGs+' 枚，单列、不计入分母。</p><h3>待回填的段</h3>'+pendHtml+'</div>'+
    '<div class="card"><h2>数据质量</h2><h3>计划枚数 ≠ 实录枚数</h3>'+misHtml+'<h3>含不入金标准息肉</h3>'+nonHtml+'<h3>病理已回填但未锁定</h3>'+unHtml+'<h3>旧字段待人工补选</h3>'+legHtml+'<h3>绒毛比例待补选</h3>'+vilHtml+'</div>'+
    '<div class="card"><h2>病理分布</h2><p class="fine">仅已回填病理的息肉。应用内「HP」显示为增生性。</p>'+dist+
    '<h3>进展期（USMSTF 2020 / ESGE 2020）</h3>'+
    '<div class="kvs"><span>进展期腺瘤</span><b>'+d.advAd+'</b></div>'+
    '<div class="kvs"><span>进展期锯齿状病变</span><b>'+d.advSer+'</b></div>'+
    '<div class="kvs"><span>癌</span><b>'+d.cancerN+'</b></div>'+
    '<div class="kvs"><span>进展期肿瘤合计</span><b>'+d.advNeo+'</b></div>'+
    '<div class="kvs"><span>含进展期肿瘤的肠段数</span><b>'+d.neoSeg+'</b></div>'+
    '<div class="kvs"><span>HP≥10mm</span><b>'+d.hp10+'</b></div>'+
    '<p class="fine">角注：按息肉计数，同一息肉只进合计一次。进展期腺瘤（不含癌）＝病理类型「腺瘤」，且满足任一：最大径≥10mm、绒毛≥25%、异型程度「高级别」。进展期锯齿状病变＝SSL伴异型（不论大小）、SSL且最大径≥10mm、或 TSA（不论大小）。癌＝病理类型「癌」或异型「浸润癌」。进展期肿瘤＝进展期腺瘤＋进展期锯齿状病变＋癌。HP≥10mm 单列，不并入以上各项。最大径未填则跳过大小判据；绒毛为旧值「有」或未填则跳过绒毛判据，不按≥25%命中。</p></div>';
  $("#main").querySelectorAll("[data-statseg]").forEach(function(b){b.onclick=function(){S.statSeg=b.getAttribute("data-statseg");renderStats();};});
  var goalIn=$("#goalIn");
  goalIn.onchange=function(){
    var t=this.value.trim();
    if(!t){writeGoal("");renderStats();return;}
    var n=parseInt(t,10);
    if(!(n>0)){this.value=readGoal()==null?"":String(readGoal());return;}
    writeGoal(n);renderStats();
  };
  $("#main").querySelectorAll("[data-sid]").forEach(function(el){
    el.onclick=function(){var id=el.getAttribute("data-sid"),pid=el.getAttribute("data-pid");openSegment(id).then(function(){if(pid)openPolyp(pid);});};
  });
  renderBanner();
  syncNav();
}
function syncNav(){
  var a=$("#navRec"),b=$("#navStat");if(!a||!b)return;
  a.classList.toggle("on",S.view!=="stats");
  b.classList.toggle("on",S.view==="stats");
}
async function showView(name){
  if(!sessKey)return;
  if(S.view==="edit"&&saveT)await flushSave();
  S.editPolypId=null;$("#ov").classList.remove("show");
  if(name!=="edit")S.cur=null;
  S.view=name;render();window.scrollTo(0,0);
}
function render(){
  if(S.view==="edit"&&S.cur)renderEdit();
  else if(S.view==="stats")renderStats();
  else renderList();
  syncNav();
}

async function init(){
  $("#topExport").onclick=exportJson;$("#topCsv").onclick=exportCsv;$("#topImport").onclick=pickImport;
  $("#lockBtn").onclick=function(){lockNow("已锁定。");};
  $("#impFile").addEventListener("change",function(){var f=this.files&&this.files[0];this.value="";if(!f)return;var r=new FileReader();r.onload=function(){importJsonText(String(r.result));};r.readAsText(f,"utf-8");});
  $("#fab").onclick=function(){if(S.view==="edit")addPolyps(1);};
  $("#navRec").onclick=function(){showView("list");};
  $("#navStat").onclick=function(){showView("stats");};
  $("#ovOk").onclick=closeSheet;$("#ovX").onclick=closeSheet;
  $("#ov").addEventListener("click",function(e){if(e.target===this)closeSheet();});
  $("#ovDel").onclick=function(){var p=curPolyp();if(!p||morphLocked())return;if(confirm("确认删除此息肉？")){S.cur.polyps=S.cur.polyps.filter(function(x){return x.id!==p.id;});closeSheet();saveSoon();renderEdit();}};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
  if(!cryptoOk()){showAuth("nocrypto");return;}
  try{await storageOpen();}catch(e){}
  showAuth(hasAuth()?"login":"setup");
  try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("/polyp-card/segment-study/sw.js", {scope: "/polyp-card/segment-study/"}).catch(function(){});}catch(e){}
}
init();
</script>
