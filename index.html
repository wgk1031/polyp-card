<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b6e75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="息肉送检卡">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>结肠息肉送检随访决策卡</title>
<style>
:root{
  --bg:#f3f6f9;--card:#fff;--ink:#17212b;--mut:#5d6b7a;--line:#dbe3ea;
  --pri:#0b6e75;--pri-d:#08565c;--pri-l:#e0f2f3;
  --red:#b42318;--red-l:#fdecea;--amb:#a15c07;--amb-l:#fff4e0;--grn:#177245;--grn-l:#e3f6ea;--blu:#1d4ed8;--blu-l:#e8efff;--pur:#6d28d9;--pur-l:#f0e9ff;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 0}
.top-in{max-width:1000px;margin:0 auto}
.top h1{font-size:18px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1 small{font-weight:400;font-size:12px;opacity:.85}
.tabs{display:flex;gap:4px}
.tab{flex:1;min-height:44px;border:0;background:transparent;color:#d6eef0;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:#fff}
.bk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bk-b{min-height:44px;background:#fff!important;color:var(--pri)!important;border-color:#fff!important;padding:6px 14px}
.bk-last{font-size:12px;color:#d6eef0}
#banner{max-width:1000px;margin:10px auto 0;padding:0 14px}
#banner .note{margin:0}
.sum{background:#0a5b61;color:#fff;font-size:14px;padding:6px 16px}
.sum-in{max-width:1000px;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
main{max-width:1000px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.note{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;border:1px solid}
.note b{margin-right:4px}
.n-info{background:var(--blu-l);border-color:#c5d5ff;color:#1e3a8a}
.n-warn{background:var(--amb-l);border-color:#f4d9a6;color:#6b3f05}
.n-bad{background:var(--red-l);border-color:#f5c2bd;color:#7a1a12}
.n-ok{background:var(--grn-l);border-color:#b7e3c6;color:#0f5132}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.fld label.lb,.lb{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #c3cfda;border-radius:10px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;min-width:56px;padding:8px 14px;border:1.5px solid #c3cfda;background:#fff;border-radius:999px;cursor:pointer;font-weight:600;color:#33414f}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.sm{min-height:40px;padding:6px 12px;font-size:14px}
.sw{display:block;cursor:pointer;position:relative}
.sw.rd span::before{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #98a6b3}
.sw.rd input:checked+span::before{background:radial-gradient(circle,var(--pri) 45%,#fff 50%);border-color:var(--pri)}
.auth{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#0b6e75,#0a4f55);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 16px 40px}
.auth-box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.auth-box h2{margin:0 0 4px;font-size:20px}
.auth-box .fld{margin-bottom:12px}
.auth-err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0 8px}
.auth-logo{font-size:40px;text-align:center}
body.locked .top,body.locked #banner,body.locked main,body.locked .sum,body.locked .fab{display:none!important}
.linkb{background:none;border:0;color:var(--pri);text-decoration:underline;min-height:44px;cursor:pointer;font-size:15px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 12px;border:1.5px solid #c3cfda;border-radius:10px;background:#fff;font-weight:600}
.sw span::before{content:"";flex:none;width:44px;height:26px;border-radius:13px;background:#c5ced6;transition:.15s;background-image:radial-gradient(circle at 13px 13px,#fff 10px,transparent 11px);background-repeat:no-repeat}
.sw input:checked+span{border-color:var(--pri);background:var(--pri-l)}
.sw input:checked+span::before{background-color:var(--pri);background-image:radial-gradient(circle at 31px 13px,#fff 10px,transparent 11px)}
.sw input:focus-visible+span{outline:2px solid var(--pri)}
.btn{min-height:50px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font-weight:700;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:active{background:var(--pri-d)}
.btn.dng{border-color:var(--red);color:var(--red)}
.btn.sm{min-height:42px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;min-height:58px;padding:0 24px;border-radius:29px;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.b-sep{background:var(--amb-l);color:var(--amb)}
.b-skip{background:var(--grn-l);color:var(--grn)}
.b-merge{background:var(--blu-l);color:var(--blu)}
.b-rep{background:var(--pur-l);color:var(--pur)}
.b-man{background:#eceff3;color:#344}
.b-bad{background:var(--red-l);color:var(--red)}
.pc{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.pc.t-sep{border-left-color:#e0951a}.pc.t-skip{border-left-color:#2e9e5f}.pc.t-merge{border-left-color:#3b6ef0}.pc.t-rep{border-left-color:#7c3aed}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pc-h .t{font-weight:700;font-size:17px}
.pc-h .m{color:var(--mut);font-size:14px}
.pc .why{font-size:14px;color:#33414f;margin:4px 0 8px}
.pc .meta{font-size:13px;color:var(--mut);margin-top:8px}
.sub{font-size:13px;color:var(--mut);margin:8px 0 4px}
table.lst{width:100%;border-collapse:collapse}
table.lst th{text-align:left;font-size:13px;color:var(--mut);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.lst td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.lst tr.rw:hover{background:#f7fafc}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .v{font-size:26px;font-weight:800;color:var(--pri)}
.stat .k{font-size:13px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .nm{width:110px;flex:none}
.bar .tr{flex:1;background:#e9eef2;border-radius:6px;height:18px;overflow:hidden}
.bar .fl{height:100%;background:var(--pri)}
.bar .vv{width:90px;flex:none;text-align:right;color:var(--mut)}
details.sm>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.sm table{width:100%;border-collapse:collapse;font-size:14px}
details.sm td,details.sm th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h b{font-size:17px}
.sheet-b{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.sec{margin-bottom:16px}
.hide{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1f2933;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw;display:none}
.toast.show{display:block}
.sticky-sum{font-size:14px}
a{color:var(--pri)}
ul.t{padding-left:20px;margin:6px 0}
ul.t li{margin:4px 0}
code{background:#eef2f5;padding:1px 5px;border-radius:4px;font-size:13px}
@media (min-width:900px){
  .sheet{border-radius:18px;margin:auto}
  .overlay{align-items:center}
}
@media (max-width:720px){
  .top{position:static}
  .sum{position:sticky;top:0;z-index:19}
  main{padding:10px 10px calc(110px + env(safe-area-inset-bottom))}
  .grid,.grid.g3{grid-template-columns:1fr}
  .top h1{font-size:16px}
  table.lst thead{display:none}
  table.lst,table.lst tbody,table.lst tr,table.lst td{display:block;width:100%}
  table.lst tr.rw{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 10px;background:#fff}
  table.lst td{border:0;padding:4px 0;display:flex;gap:8px}
  table.lst td::before{content:attr(data-l);flex:none;width:78px;color:var(--mut);font-size:13px;padding-top:2px}
  table.lst td.act{padding-top:8px}
  table.lst td.act::before{display:none}
  .bar .nm{width:84px}.bar .vv{width:74px}
  .fab{left:16px;right:16px;font-size:18px}
  .chip{flex:0 1 auto}
}
@media print{.top,.fab,.sum{display:none}}
</style>
</head>
<body class="locked">
<header class="top"><div class="top-in">
  <h1><span>结肠息肉送检随访决策卡</span><small id="saveState">载入中…</small></h1>
  <div class="bk-row"><button class="btn bk-b" id="topExport">⬇ 导出备份</button><button class="btn bk-b" id="topImport">⬆ 导入备份</button><button class="btn bk-b" id="lockBtn">🔒 锁定</button><span class="bk-last" id="bkLast"></span></div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-v="list">患者</button>
    <button class="tab" data-v="stats">统计</button>
    <button class="tab" data-v="backup">备份/说明</button>
  </nav>
</div></header>
<div class="sum hide" id="sumBar"><div class="sum-in" id="sumIn"></div></div>
<div id="banner"></div>
<main id="main"></main>
<input type="file" id="impFile" accept=".json,application/json" class="hide">
<button class="btn pri fab hide" id="fab">＋ 添加息肉</button>
<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><b id="ovTitle">编辑息肉</b><button class="btn sm" id="ovX">关闭</button></div><div class="sheet-b" id="ovBody"></div><div class="sheet-f"><button class="btn dng" id="ovDel">删除此条</button><button class="btn pri" id="ovOk">完成</button></div></div></div>
<div class="overlay" id="dlg" style="z-index:120"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><b id="dlgT"></b></div><div class="sheet-b" id="dlgB"></div><div class="auth-err" id="dlgErr" style="padding:0 16px"></div><div class="sheet-f"><button class="btn" id="dlgNo">取消</button><button class="btn pri" id="dlgOk">确定</button></div></div></div>
<div class="auth hide" id="auth"><div class="auth-box" id="authBox"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= 规则逻辑（移植自 Canvas，保持一致） ================= */
var SEGMENTS=["回盲部","盲肠","升结肠","横结肠","降结肠","乙状结肠","直肠"];
var PROXIMAL=["回盲部","盲肠","升结肠","横结肠"];
var PARIS=["未选","0-Ip","0-Isp","0-Is","0-IIa","0-IIb","0-IIc","0-III","LST-G","LST-NG"];
var NICE_OPTS=["未选","NICE 1","NICE 2","NICE 3"];
var JNET_OPTS=["未选","JNET 1","JNET 2A","JNET 2B","JNET 3"];
var PATH_OPTS=["未回填","增生性","管状腺瘤LGD","管状腺瘤HGD","绒毛/管状绒毛","SSL无异型","SSL伴异型","TSA","癌/T1","其他"];
var MARGIN_OPTS=["未填","阴性","阳性","无法评估"];
var FINAL_OPTS=["手改·单独送","手改·合并送","手改·不送检","手改·可不切除"];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad2(n){return (n<10?"0":"")+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function nowIso(){return new Date().toISOString();}
function emptyPolyp(segment){return {id:uid(),segment:segment,distanceCm:"",sizeMm:"",paris:"未选",nice:"未选",jnet:"未选",suspectSsl:false,mucusCap:false,erosion:false,confidence:"高置信度",copies:"1",representative:false,photoWl:true,photoNbi:true,adopt:"未定",finalMethod:"手改·单独送",pathClass:"未回填",margin:"未填",pathNote:""};}
function emptyPatient(){var d=new Date(),t=nowIso();return {id:uid(),label:"患者 "+pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds()),examNo:"",examDate:todayStr(),lynch:false,sps:false,fap:false,priorAdvanced:false,ibdDysplasia:false,opticalOk:false,billing:"未知",tinyPolicy:"优先不送检",guideline:"中国2023",polyps:[],createdAt:t,updatedAt:t};}
/* 注意：空字符串视为未填(NaN)，Canvas 原版 Number("")=0 会把未填大小当作 0 mm（见报告） */
function parseNum(s){if(s===null||s===undefined)return NaN;var t=String(s).trim();if(t==="")return NaN;var n=Number(t);return isFinite(n)?n:NaN;}
function expandCount(p){var n=Math.floor(parseNum(p.copies));return n>=1?n:1;}
function totalPolypCount(ps){return ps.reduce(function(s,p){return s+expandCount(p);},0);}
function segmentCount(ps,seg){return ps.filter(function(p){return p.segment===seg;}).reduce(function(s,p){return s+expandCount(p);},0);}
function hasHighRisk(pt){return !!(pt.lynch||pt.sps||pt.fap||pt.priorAdvanced||pt.ibdDysplasia);}
function highRiskLabel(pt){var a=[];if(pt.lynch)a.push("Lynch");if(pt.sps)a.push("SPS");if(pt.fap)a.push("FAP/AFAP");if(pt.priorAdvanced)a.push("既往进展期/T1");if(pt.ibdDysplasia)a.push("IBD异型");return a.length?a.join("、"):"无";}
function isDepressed(p){return p.paris==="0-IIc"||p.paris==="0-III";}
function isHighRiskOptics(p){return p.nice==="NICE 3"||p.jnet==="JNET 2B"||p.jnet==="JNET 3";}
function proximalMucusSsl(p){return PROXIMAL.indexOf(p.segment)>=0&&!!p.mucusCap;}
function photosOk(p){return !!(p.photoWl&&p.photoNbi);}
function forcesSeparate(p,pt){
  if(hasHighRisk(pt))return "高危背景："+highRiskLabel(pt);
  var size=parseNum(p.sizeMm);
  if(!isNaN(size)&&size>=10)return "≥10 mm";
  if(isDepressed(p))return "凹陷型 Paris 0-IIc/III";
  if(isHighRiskOptics(p))return "NICE 3 或 JNET 2B/3";
  if(p.confidence==="低置信度")return "低置信度光学诊断";
  if(p.erosion)return "糜烂/溃疡样表现";
  if(p.suspectSsl)return "标记为可疑 SSL";
  if(proximalMucusSsl(p))return "近端（含回盲部/盲肠）黏液帽，按可疑 SSL";
  if(!photosOk(p))return "未同时留白光+NBI 图";
  return null;
}
/* 系统建议（不含“手改”分支；手改只影响“最终送检方式”，不改变建议本身） */
function suggestSpecimen(p,pt,total){
  var force=forcesSeparate(p,pt);
  if(force)return {action:"单独送检",reason:force,needsRepHint:false};
  if(!pt.opticalOk){
    if(p.representative&&total>=5)return {action:"代表性单独送",reason:"光学诊断未达标 + 已勾代表性",needsRepHint:false};
    return {action:"单独送检",reason:"光学诊断未达标：不允许高置信度不送/合并",needsRepHint:false};
  }
  var size=parseNum(p.sizeMm);
  var distal=p.segment==="乙状结肠"||p.segment==="直肠";
  var multi=total>=5;
  if(p.representative&&multi)return {action:"代表性单独送",reason:total>=10?"全肠 ≥10 枚且本条勾选代表性：代表性单独送（其余仍可简化）":"全肠 ≥5 枚且本条勾选代表性：本段代表性单独送",needsRepHint:false};
  if(!isNaN(size)&&size<=5&&distal&&p.nice==="NICE 1"&&p.confidence==="高置信度"&&!isDepressed(p))
    return {action:"可不切除",reason:"直乙 ≤5 mm、NICE 1、高置信度（diagnose-and-leave）",needsRepHint:multi};
  if(!isNaN(size)&&size<=5&&p.confidence==="高置信度"){
    if(pt.tinyPolicy==="同段合并留档")return {action:"同段合并送",reason:"≤5 mm 高置信度：按策略同段合并留档",needsRepHint:multi};
    return {action:"不送检",reason:"≤5 mm 高置信度：优先不送检（resect-and-discard）",needsRepHint:multi};
  }
  if(!isNaN(size)&&size>=6&&size<=9&&p.confidence==="高置信度"){
    if(pt.billing==="按蜡块")return {action:"单独送检",reason:"6–9 mm 高置信度：按蜡块计费时合并不一定省，默认单独送",needsRepHint:multi};
    if(pt.billing==="未知")return {action:"同段合并送",reason:"6–9 mm 高置信度：计费未知时暂按合并；请尽快确认按瓶/按蜡块",needsRepHint:multi};
    return {action:"同段合并送",reason:"6–9 mm 高置信度、按瓶计费：同段合并送",needsRepHint:multi};
  }
  if(isNaN(size)||p.nice==="未选"||p.paris==="未选")return {action:"单独送检",reason:"大小/Paris/NICE 未填全，默认单独送",needsRepHint:multi};
  return {action:"单独送检",reason:"未命中简化条件，默认单独送",needsRepHint:multi};
}
/* 与 Canvas decideSpecimen 一致的入口：手改 → “手改·…”；否则 = 系统建议 */
function decideSpecimen(p,pt,total){
  var s=suggestSpecimen(p,pt,total);
  if(p.adopt==="手改"){
    var fin=FINAL_OPTS.indexOf(p.finalMethod)>=0?p.finalMethod:"手改·单独送";
    return {action:fin,reason:"已手改（系统建议："+s.action+"，依据："+s.reason+"）",needsRepHint:false,suggest:s};
  }
  return {action:s.action,reason:s.reason,needsRepHint:s.needsRepHint,suggest:s};
}
function finalCategory(p,d){
  if(p.adopt==="手改"){var f=(FINAL_OPTS.indexOf(p.finalMethod)>=0?p.finalMethod:"手改·单独送").replace("手改·","");
    return f==="单独送"?"单独送检":f==="合并送"?"同段合并送":f;}
  return d.suggest.action;
}
function pathRiskOf(p){
  if(p.margin==="阳性"||p.margin==="无法评估")return "切缘阳性/无法评估";
  if(p.pathClass==="癌/T1")return "癌/T1";
  if(p.pathClass==="管状腺瘤HGD"||p.pathClass==="绒毛/管状绒毛"||p.pathClass==="SSL伴异型"||p.pathClass==="TSA")return "高级别/绒毛/SSL伴异型";
  if(p.pathClass==="管状腺瘤LGD")return "腺瘤LGD";
  if(p.pathClass==="SSL无异型")return "SSL无异型";
  if(p.pathClass==="增生性")return "增生性";
  var note=p.pathNote||"";
  if(/癌|T1|浸润/.test(note))return "癌/T1";
  if(/高级别|HGD|绒毛|伴异型/.test(note))return "高级别/绒毛/SSL伴异型";
  return null;
}
function worstPath(ps){
  var order=["癌/T1","切缘阳性/无法评估","高级别/绒毛/SSL伴异型","腺瘤LGD","SSL无异型","增生性"];
  var best=null,bi=999;
  ps.forEach(function(p){var r=pathRiskOf(p);if(!r)return;var i=order.indexOf(r);if(i>=0&&i<bi){bi=i;best=r;}});
  return best;
}
function adenomaCountProxy(ps){
  var total=0,maxSize=0,ge10=false,any69=false,adenomaLike=0,sslSmall=0,sslBig=false;
  ps.forEach(function(p){
    var size=parseNum(p.sizeMm),n=expandCount(p);
    if(isNaN(size))return;
    total+=n;
    if(size>maxSize)maxSize=size;
    if(size>=10)ge10=true;
    if(size>=6&&size<=9)any69=true;
    var pr=pathRiskOf(p);
    if(pr==="腺瘤LGD"||pr==="高级别/绒毛/SSL伴异型"||pr==="癌/T1"||p.pathClass==="未回填"){
      if(p.pathClass==="未回填"){
        if(p.nice==="NICE 2"||p.jnet==="JNET 2A"||p.jnet==="JNET 2B")adenomaLike+=n;
        else if(p.nice!=="NICE 1")adenomaLike+=n;
      }else if(pr==="腺瘤LGD"||pr==="高级别/绒毛/SSL伴异型"||pr==="癌/T1"){adenomaLike+=n;}
    }
    if(pr==="SSL无异型"||p.pathClass==="SSL无异型"){if(size<10)sslSmall+=n;else sslBig=true;}
    if(p.pathClass==="SSL伴异型"||p.pathClass==="TSA")sslBig=true;
    if(size>=10&&(p.suspectSsl||proximalMucusSsl(p)))sslBig=true;
  });
  return {total:total,maxSize:maxSize,ge10:ge10,any69:any69,adenomaLike:adenomaLike,sslSmall:sslSmall,sslBig:sslBig};
}
function followUp(ps,pt){
  if(hasHighRisk(pt))return {interval:"按专项监测（非本简化卡）",basis:"高危："+highRiskLabel(pt),pathOverride:null,tone:"danger"};
  var worst=worstPath(ps);
  if(worst==="癌/T1")return {interval:"T1 路径：多学科评估追加手术 vs 内镜随访",basis:"病理分类为癌/T1",pathOverride:worst,tone:"danger"};
  if(worst==="切缘阳性/无法评估")return {interval:"缩短复查 / 评估再处理（切缘问题）",basis:"切缘阳性或无法评估",pathOverride:worst,tone:"danger"};
  var s=adenomaCountProxy(ps);
  if(s.total===0)return {interval:"待录入息肉",basis:"尚无有效大小",pathOverride:null,tone:"warning"};
  var pathHi=worst==="高级别/绒毛/SSL伴异型";
  if(pt.guideline==="ESGE2020"){
    if(pathHi||s.ge10||s.adenomaLike>=5||s.sslBig)return {interval:"3 年",basis:"ESGE 高危：≥10 mm / HGD·绒毛 / ≥5 枚腺瘤 / SSL≥10 mm或伴异型",pathOverride:pathHi?worst:null,tone:pathHi?"warning":"success"};
    return {interval:"回常规筛查（无组织筛查时约 10 年肠镜）",basis:"ESGE 低危：1–4 枚 <10 mm 且无高危病理",pathOverride:null,tone:"success"};
  }
  if(pt.guideline==="USMSTF2020"){
    if(pathHi||s.ge10||s.sslBig)return {interval:"约 3 年",basis:"USMSTF：进展期腺瘤/SSL 或 ≥10 mm",pathOverride:pathHi?worst:null,tone:pathHi?"warning":"success"};
    if(s.adenomaLike>=3&&s.adenomaLike<=4)return {interval:"3–5 年",basis:"USMSTF：3–4 枚 <10 mm 管状腺瘤",pathOverride:null,tone:"success"};
    if(s.adenomaLike>=5)return {interval:"约 3 年（枚数增多时偏紧；≥10 枚需评估息肉病）",basis:"USMSTF：较多腺瘤",pathOverride:null,tone:"warning"};
    return {interval:"7–10 年",basis:"USMSTF：1–2 枚 <10 mm 管状腺瘤近似",pathOverride:null,tone:"success"};
  }
  if(pathHi||s.ge10||s.sslBig)return {interval:"1–2 年",basis:"中国2023：>10 mm / 绒毛或高级别 / SSL≥10 mm或伴异型 / TSA",pathOverride:pathHi?worst:null,tone:"warning"};
  if(s.total>10||s.adenomaLike>10)return {interval:"1 年",basis:"中国2023：>10 枚腺瘤",pathOverride:null,tone:"warning"};
  if(s.adenomaLike>=3||s.total>=3||s.any69)return {interval:"1–2 年",basis:"中国2023：3–10 枚管状腺瘤档（或存在 6–9 mm 时偏紧）",pathOverride:null,tone:"success"};
  if(s.sslSmall>=1&&s.adenomaLike===0)return {interval:"2–3 年",basis:"中国2023：<10 mm 无异型 SSL",pathOverride:null,tone:"success"};
  return {interval:"1–3 年",basis:"中国2023：1–2 枚 <10 mm 管状腺瘤近似（数目+大小；病理未改写）",pathOverride:(worst&&worst!=="增生性")?worst:null,tone:"success"};
}
function segmentsNeedingRep(pt){
  var total=totalPolypCount(pt.polyps);if(total<5)return [];
  var segs=[];pt.polyps.forEach(function(p){if(segs.indexOf(p.segment)<0)segs.push(p.segment);});
  return segs.filter(function(seg){return !pt.polyps.some(function(x){return x.segment===seg&&x.representative;});});
}
window.PolypLogic={forcesSeparate:forcesSeparate,suggestSpecimen:suggestSpecimen,decideSpecimen:decideSpecimen,followUp:followUp,emptyPatient:emptyPatient,emptyPolyp:emptyPolyp,totalPolypCount:totalPolypCount,segmentsNeedingRep:segmentsNeedingRep};

/* ================= 加密持久化：IndexedDB(加密记录) + localStorage 镜像(同样加密) ================= */
var DB2="polypCardSecure",LS_ENC="polypCard.enc.v2",LS_AUTH="polypCard.auth.v2";
var LEGACY_DB="polypCardDB",LEGACY_LS="polypCard.patients.v1";
var LS_BK="polypCard.lastBackup",LS_DEV="polypCard.device";
var KDF_ITER=300000;
var IDLE_MS=15*60*1000;
var idb=null,backendName="localStorage",cache=new Map(),encCache=new Map(),authRec=null,sessKey=null,sessUser="";
var TE=new TextEncoder(),TD=new TextDecoder();
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function b64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function cryptoOk(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues);}
async function deriveKey(pw,salt,iter){
  var km=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:iter},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function aesEnc(key,text,aad){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv,additionalData:TE.encode(aad||"")},key,TE.encode(text));return {iv:b64(iv),ct:b64(ct)};}
async function aesDec(key,rec,aad){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(rec.iv),additionalData:TE.encode(aad||"")},key,unb64(rec.ct));return TD.decode(pt);}

function normPolyp(p){var d=emptyPolyp("回盲部");var o={};for(var k in d)o[k]=(p&&p[k]!==undefined&&p[k]!==null)?p[k]:d[k];
  if(typeof o.id!=="string"||!o.id)o.id=uid();
  ["suspectSsl","mucusCap","erosion","representative","photoWl","photoNbi"].forEach(function(k){o[k]=!!o[k];});
  ["distanceCm","sizeMm","copies","pathNote"].forEach(function(k){o[k]=String(o[k]);});
  return o;}
function normPatient(p){var d=emptyPatient();var o={};for(var k in d)o[k]=(p&&p[k]!==undefined&&p[k]!==null)?p[k]:d[k];
  if(typeof o.id!=="string"||!o.id)o.id=uid();
  ["lynch","sps","fap","priorAdvanced","ibdDysplasia","opticalOk"].forEach(function(k){o[k]=!!o[k];});
  o.label=String(o.label);o.examNo=String(o.examNo);o.examDate=String(o.examDate||"");
  o.polyps=Array.isArray(p&&p.polyps)?p.polyps.map(normPolyp):[];
  if(isNaN(Date.parse(o.createdAt)))o.createdAt=nowIso();
  if(isNaN(Date.parse(o.updatedAt)))o.updatedAt=o.createdAt;
  return o;}
function newer(a,b){return Date.parse(a.updatedAt)>Date.parse(b.updatedAt);}

/* --- IndexedDB 基础 --- */
function openDB2(){return new Promise(function(res,rej){
  if(!window.indexedDB)return rej(new Error("no indexedDB"));
  var r;try{r=indexedDB.open(DB2,1);}catch(e){return rej(e);}
  r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains("enc"))d.createObjectStore("enc",{keyPath:"id"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
  setTimeout(function(){rej(new Error("idb timeout"));},4000);
});}
function idbGetAll(store){return new Promise(function(res,rej){var q=idb.transaction(store,"readonly").objectStore(store).getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});}
function idbTx(stores,fn){return new Promise(function(res,rej){var tx=idb.transaction(stores,"readwrite");fn(tx);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};});}
function readLsAuth(){try{var a=JSON.parse(lsGet(LS_AUTH)||"null");return a&&a.salt&&a.check?a:null;}catch(e){return null;}}
function readLsEnc(){try{var a=JSON.parse(lsGet(LS_ENC)||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
function lsWriteEnc(){return lsSet(LS_ENC,JSON.stringify(Array.from(encCache.values())));}

async function storageOpen(){
  var a=null;
  try{idb=await openDB2();backendName="IndexedDB（加密）+ localStorage 加密镜像";var m=await idbGetAll("meta");a=m.filter(function(x){return x.k==="auth";})[0]||null;}
  catch(e){idb=null;backendName="localStorage 加密镜像（IndexedDB 不可用）";}
  var la=readLsAuth();
  authRec=a||la||null;
  if(authRec&&!a&&idb){try{await idbTx(["meta"],function(tx){tx.objectStore("meta").put(authRec);});}catch(e){}}
  if(authRec&&!la)lsSet(LS_AUTH,JSON.stringify(authRec));
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}
function hasAuth(){return !!authRec;}

/* --- 读取旧版明文数据（迁移用） --- */
async function readLegacy(){
  var map=new Map();
  try{var a=JSON.parse(lsGet(LEGACY_LS)||"[]");if(Array.isArray(a))a.forEach(function(p){if(p&&typeof p.id==="string"){var n=normPatient(p);map.set(n.id,n);}});}catch(e){}
  try{
    if(window.indexedDB){
      var d=await new Promise(function(res,rej){var r=indexedDB.open(LEGACY_DB);r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onupgradeneeded=function(){};setTimeout(function(){rej(new Error("t"));},3000);});
      if(d.objectStoreNames.contains("patients")){
        var all=await new Promise(function(res,rej){var q=d.transaction("patients","readonly").objectStore("patients").getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});
        all.forEach(function(p){if(p&&typeof p.id==="string"){var n=normPatient(p),c=map.get(n.id);if(!c||newer(n,c))map.set(n.id,n);}});
      }
      d.close();
    }
  }catch(e){}
  return Array.from(map.values());
}
function wipeLegacy(){
  lsDel(LEGACY_LS);
  try{if(window.indexedDB)indexedDB.deleteDatabase(LEGACY_DB);}catch(e){}
}

/* --- 写入队列（串行，避免异步加密乱序覆盖） --- */
var saveQueue=Promise.resolve();
function enqueue(fn){var p=saveQueue.then(fn,fn);saveQueue=p.then(function(){},function(){});return p;}
async function encRecord(p){var r=await aesEnc(sessKey,JSON.stringify(p),p.id);return {id:p.id,iv:r.iv,ct:r.ct};}
function dbPut(p){cache.set(p.id,p);return enqueue(async function(){
  var rec=await encRecord(p);encCache.set(p.id,rec);var ok=lsWriteEnc();
  if(idb){try{await idbTx(["enc"],function(tx){tx.objectStore("enc").put(rec);});return true;}catch(e){return ok;}}
  return ok;});}
function dbPutMany(arr){arr.forEach(function(p){cache.set(p.id,p);});return enqueue(async function(){
  var recs=[];for(var i=0;i<arr.length;i++)recs.push(await encRecord(arr[i]));
  recs.forEach(function(r){encCache.set(r.id,r);});var ok=lsWriteEnc();
  if(idb){try{await idbTx(["enc"],function(tx){recs.forEach(function(r){tx.objectStore("enc").put(r);});});return true;}catch(e){return ok;}}
  return ok;});}
function dbDelete(id){cache.delete(id);return enqueue(async function(){encCache.delete(id);lsWriteEnc();
  if(idb){try{await idbTx(["enc"],function(tx){tx.objectStore("enc").delete(id);});}catch(e){}}});}

/* --- 账户 --- */
async function makeAuth(user,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var key=await deriveKey(pw,salt,KDF_ITER);
  var chk=await aesEnc(key,"polyp-card-ok","check");
  return {key:key,auth:{k:"auth",v:2,user:user,salt:b64(salt),iter:KDF_ITER,check:chk}};
}
async function verifyPw(pw){
  try{var key=await deriveKey(pw,unb64(authRec.salt),authRec.iter);var t=await aesDec(key,authRec.check,"check");return t==="polyp-card-ok"?key:null;}catch(e){return null;}
}
/* 首次设置：迁移旧版明文数据并加密 */
async function createAccount(user,pw){
  var m=await makeAuth(user,pw);
  var legacy=await readLegacy();
  var recs=[];
  for(var i=0;i<legacy.length;i++){recs.push(await aesEnc(m.key,JSON.stringify(legacy[i]),legacy[i].id).then(function(r,idx){return r;}));}
  var enc=legacy.map(function(p,i){return {id:p.id,iv:recs[i].iv,ct:recs[i].ct};});
  /* 先写入加密数据并校验，再清除旧明文 */
  if(idb){await idbTx(["enc","meta"],function(tx){tx.objectStore("enc").clear();enc.forEach(function(r){tx.objectStore("enc").put(r);});tx.objectStore("meta").put(m.auth);});}
  encCache=new Map();enc.forEach(function(r){encCache.set(r.id,r);});
  if(!lsWriteEnc()||!lsSet(LS_AUTH,JSON.stringify(m.auth))){if(!idb)throw new Error("本机存储不可用，无法保存。");}
  authRec=m.auth;sessKey=m.key;sessUser=user;
  cache=new Map();legacy.forEach(function(p){cache.set(p.id,p);});
  wipeLegacy();
  return legacy.length;
}
async function loginAccount(user,pw){
  if(!authRec||user!==authRec.user)return {ok:false};
  var key=await verifyPw(pw);if(!key)return {ok:false};
  sessKey=key;sessUser=authRec.user;cache=new Map();encCache=new Map();
  var recs=[];
  if(idb){try{recs=await idbGetAll("enc");}catch(e){recs=[];}}
  var la=readLsAuth();
  if(la&&la.salt===authRec.salt){var byId={};recs.forEach(function(r){byId[r.id]=true;});readLsEnc().forEach(function(r){if(r&&r.id&&!byId[r.id])recs.push(r);});}
  var bad=0;
  for(var i=0;i<recs.length;i++){
    try{var p=normPatient(JSON.parse(await aesDec(key,recs[i],recs[i].id)));encCache.set(recs[i].id,{id:recs[i].id,iv:recs[i].iv,ct:recs[i].ct});var c=cache.get(p.id);if(!c||newer(p,c))cache.set(p.id,p);}
    catch(e){bad++;}
  }
  return {ok:true,bad:bad};
}
async function changePassword(oldPw,newPw){
  var okKey=await verifyPw(oldPw);if(!okKey)return "旧密码不正确";
  return enqueue(async function(){
    var m=await makeAuth(authRec.user,newPw);
    var pts=Array.from(cache.values());var recs=[];
    for(var i=0;i<pts.length;i++){var r=await aesEnc(m.key,JSON.stringify(pts[i]),pts[i].id);recs.push({id:pts[i].id,iv:r.iv,ct:r.ct});}
    if(idb){await idbTx(["enc","meta"],function(tx){tx.objectStore("enc").clear();recs.forEach(function(r){tx.objectStore("enc").put(r);});tx.objectStore("meta").put(m.auth);});}
    encCache=new Map();recs.forEach(function(r){encCache.set(r.id,r);});
    lsWriteEnc();lsSet(LS_AUTH,JSON.stringify(m.auth));
    authRec=m.auth;sessKey=m.key;return null;
  });
}
function lockMemory(){sessKey=null;cache=new Map();encCache=new Map();}
async function clearAllLocal(){
  try{if(idb){idb.close();idb=null;}}catch(e){}
  await new Promise(function(res){try{var r=indexedDB.deleteDatabase(DB2);r.onsuccess=r.onerror=r.onblocked=function(){res();};setTimeout(res,2000);}catch(e){res();}});
  [LS_ENC,LS_AUTH,LEGACY_LS,LS_BK].forEach(lsDel);
  try{indexedDB.deleteDatabase(LEGACY_DB);}catch(e){}
  authRec=null;lockMemory();
}

/* 绑定：容器内 data-k 控件 → obj[k]。onChange(key,isChip) */
function bind(root,getObj,onChange){
  root.addEventListener("click",function(e){
    var b=e.target.closest(".chip[data-k]");if(!b||!root.contains(b))return;
    var k=b.getAttribute("data-k"),v=b.getAttribute("data-v");var o=getObj(b);if(!o)return;
    o[k]=v;Array.prototype.forEach.call(b.parentNode.children,function(c){c.classList.toggle("on",c===b);});
    onChange(k,true,b);
  });
  root.addEventListener("input",function(e){
    var t=e.target;if(!t.matches||!t.matches("input[data-k],select[data-k],textarea[data-k]"))return;
    var o=getObj(t);if(!o)return;var k=t.getAttribute("data-k");
    o[k]=t.type==="checkbox"?t.checked:t.value;onChange(k,false,t);

function renderStats(){
  var pts=Array.from(cache.values());var recs=0,exp=0,filled=0,adopt=0,manual=0,undec=0,cats={};
  ["单独送检","同段合并送","代表性单独送","不送检","可不切除"].forEach(function(k){cats[k]=0;});
  pts.forEach(function(pt){var tot=totalPolypCount(pt.polyps);pt.polyps.forEach(function(p){
    recs++;exp+=expandCount(p);if(p.pathClass!=="未回填")filled++;
    if(p.adopt==="采纳")adopt++;else if(p.adopt==="手改")manual++;else undec++;
    var d=decideSpecimen(p,pt,tot);var c=finalCategory(p,d);cats[c]=(cats[c]||0)+1;});});
  var dec=adopt+manual;
  function pct(a,b){return b?Math.round(a*1000/b)/10+"%":"—";}
  var html='<div class="card"><h2>统计面板</h2><div class="stat-grid">'+
   '<div class="stat"><div class="v">'+pts.length+'</div><div class="k">总患者数</div></div>'+
   '<div class="stat"><div class="v">'+exp+'</div><div class="k">总息肉数（按枚，含“同特征枚数”）</div></div>'+
   '<div class="stat"><div class="v">'+recs+'</div><div class="k">息肉记录条数</div></div>'+
   '<div class="stat"><div class="v">'+pct(adopt,dec)+'</div><div class="k">建议采纳率（采纳 '+adopt+' / 已决策 '+dec+'）</div></div>'+
   '<div class="stat"><div class="v">'+pct(filled,recs)+'</div><div class="k">病理回填率（'+filled+' / '+recs+'）</div></div>'+

function buildCsv(){
  var H=["患者id","检查日期","检查号","患者标识","Lynch","SPS","FAP/AFAP","既往进展期/T1","IBD异型","光学诊断达标","病理计费","≤5mm策略","随访指南","患者息肉总枚数","随访建议间隔","随访依据","患者创建时间","患者修改时间","息肉id","肠段","距肛缘cm","大小mm","Paris/LST","NICE","JNET","可疑SSL","黏液帽","糜烂溃疡样","光学置信度","同特征枚数","段内代表性","已留白光图","已留NBI图","系统送检建议","建议依据","采纳状态","最终送检方式","病理分类","切缘","病理备注"];
  var rows=[H];
  var pts=Array.from(cache.values()).sort(function(a,b){return (a.examDate||"").localeCompare(b.examDate||"")||Date.parse(a.createdAt)-Date.parse(b.createdAt);});
  pts.forEach(function(pt){
    var tot=totalPolypCount(pt.polyps),fu=followUp(pt.polyps,pt);
    var base=[pt.id,pt.examDate,pt.examNo,pt.label,yn(pt.lynch),yn(pt.sps),yn(pt.fap),yn(pt.priorAdvanced),yn(pt.ibdDysplasia),yn(pt.opticalOk),pt.billing,pt.tinyPolicy,pt.guideline,tot,fu.interval,fu.basis,fmtDT(pt.createdAt),fmtDT(pt.updatedAt)];
    if(!pt.polyps.length){rows.push(base.concat(new Array(H.length-base.length).fill("")));return;}
    pt.polyps.forEach(function(p){var d=decideSpecimen(p,pt,tot);
      rows.push(base.concat([p.id,p.segment,p.distanceCm,p.sizeMm,p.paris,p.nice,p.jnet,yn(p.suspectSsl),yn(p.mucusCap),yn(p.erosion),p.confidence,expandCount(p),yn(p.representative),yn(p.photoWl),yn(p.photoNbi),d.suggest.action,d.suggest.reason,p.adopt,finalCategory(p,d)+(p.adopt==="手改"?"（手改）":""),p.pathClass,p.margin,p.pathNote]));});
  });
  return "\uFEFF"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n")+"\r\n";
}

async function decryptBackup(obj){
  if(!obj.kdf||!obj.kdf.salt||!obj.iv||!obj.ct||!(obj.kdf.iter>0&&obj.kdf.iter<=5000000)){alert("导入失败：加密备份文件格式不正确。");return null;}
  if(authRec&&obj.kdf.salt===authRec.salt){try{var o=JSON.parse(await aesDec(sessKey,obj,"backup"));if(Array.isArray(o.patients))return o.patients;}catch(e){}}
  var pl=null;
  var r=await dialog({title:"输入备份密码",ok:"解密并导入",html:'<p style="margin-top:0">这份加密备份的密码与当前账号不同。请输入<b>导出该备份的那台设备的登录密码</b>。</p>'+pwField("pw","备份密码"),
    collect:function(root){return {pw:dv(root,"pw")};},
    validate:async function(v){if(!v.pw)return "请输入备份密码";
      try{var k=await deriveKey(v.pw,unb64(obj.kdf.salt),obj.kdf.iter);var o=JSON.parse(await aesDec(k,obj,"backup"));if(!Array.isArray(o.patients))return "备份内容不正确";pl=o.patients;return null;}
      catch(e){return "备份密码错误，或文件已损坏";}}});
  return r?pl:null;
}
async function importJsonText(text){
  if(!sessKey)return;
  var obj;try{obj=JSON.parse(text);}catch(e){alert("导入失败：不是有效的 JSON 文件。");return;}
  var list;
  if(obj&&obj.encrypted){list=await decryptBackup(obj);if(!list)return;}
  else list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.patients)?obj.patients:null);
  if(!list){alert("导入失败：文件里没有找到患者数据（应为本工具导出的备份文件）。");return;}
  if(S.view==="edit"&&saveT)await flushSave();
  var add=0,upd=0,skip=0,bad=0,put=[];
  list.forEach(function(raw){
    if(!raw||typeof raw.id!=="string"||!raw.id||!Array.isArray(raw.polyps)){bad++;return;}
    var n=normPatient(raw),c=cache.get(n.id);
    if(!c){add++;put.push(n);}
    else if(newer(n,c)){upd++;put.push(n);}
    else skip++;
  });
  if(put.length)await dbPutMany(put);
  if(S.view==="edit"&&S.cur&&cache.get(S.cur.id)){S.cur=JSON.parse(JSON.stringify(cache.get(S.cur.id)));}
  render();
  var msg="导入完成：新增 "+add+" 条，更新 "+upd+" 条（备份里更新），跳过 "+skip+" 条（本机已有且不比备份旧）"+(bad?"，无效 "+bad+" 条":"")+"。\n同一 id 以修改时间较新者为准。"+(obj.device?"\n备份来源设备："+obj.device:"")+(obj.encrypted?"\n（加密备份，已解密并重新加密存入本机）":"");
  alert(msg);
}

  if(p!==p2){err.textContent="两次输入的密码不一致";return;}
  err.textContent="";go.disabled=true;go.textContent="正在加密…";
  try{var n=await createAccount(u,p);afterUnlock(n>0?"已将本机 "+n+" 位旧版未加密患者数据加密迁移。":"账号已设置。");}
  catch(e){err.textContent="设置失败："+(e&&e.message||e);go.disabled=false;go.textContent="设置并进入";}
}
async function doLogin(){
  var now=Date.now(),err=$("#aErr"),go=$("#aGo");
  if(now<blockUntil){err.textContent="尝试次数过多，请 "+Math.ceil((blockUntil-now)/1000)+" 秒后再试";return;}
  var u=$("#aUser").value.trim(),p=$("#aPw").value;
  if(!u||!p){err.textContent="请输入用户名和密码";return;}
  err.textContent="";go.disabled=true;go.textContent="验证中…";
  var r;try{r=await loginAccount(u,p);}catch(e){r={ok:false};}
  go.disabled=false;go.textContent="登录";
  if(!r.ok){failCount++;if(failCount>=5){blockUntil=Date.now()+30000;failCount=0;err.textContent="用户名或密码错误。连续错误 5 次，请 30 秒后再试。";}else err.textContent="用户名或密码错误";$("#aPw").value="";return;}
  failCount=0;afterUnlock(r.bad?"有 "+r.bad+" 条记录无法解密（可能已损坏），请用备份恢复。":"");
}
function afterUnlock(note){
  document.body.classList.remove("locked");$("#auth").classList.add("hide");$("#authBox").innerHTML="";
  S.view="list";S.cur=null;S.q="";S.from="";S.to="";startIdle();
  setSaveState("已就绪 · "+cache.size+" 位患者 · 用户 "+sessUser);render();window.scrollTo(0,0);
  if(note)toast(note);
}
async function lockNow(msg){
  if(!sessKey)return;
  closeSheet();$("#dlg").classList.remove("show");$("#toast").classList.remove("show");
  if(saveT)await flushSave();await saveQueue;
  S.cur=null;S.editId=null;lockMemory();clearInterval(idleTimer);setSaveState("已锁定");
  showAuth("login",msg||"已锁定。");
}
function touchAct(){lastAct=Date.now();}
function checkIdle(){if(sessKey&&Date.now()-lastAct>IDLE_MS)lockNow("空闲超过 15 分钟，已自动锁定。");}
function startIdle(){touchAct();clearInterval(idleTimer);idleTimer=setInterval(checkIdle,3000);}
["pointerdown","keydown","touchstart","input","scroll","click"].forEach(function(ev){document.addEventListener(ev,touchAct,{passive:true,capture:true});});
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkIdle();});

/* ================= 初始化 ================= */
function initMainBind(){
  var main=$("#main");
  bind(main,function(el){var k=el.getAttribute("data-k");if(S.view!=="edit"||!S.cur)return null;if(el.closest("#plistE"))return null;if(k==="seg")return {};return S.cur;},function(k){
    if(k==="seg")return;
    saveSoon();refreshResults();
  });
  main.addEventListener("click",function(e){var b=e.target.closest('.chip[data-k="seg"]');if(b&&S.view==="edit"){S.segSel=b.getAttribute("data-v");$("#segName").textContent=S.segSel;refreshResults();}});
}
async function init(){
  initMainBind();
  $("#tabs").addEventListener("click",function(e){var t=e.target.closest(".tab");if(t&&sessKey)setView(t.getAttribute("data-v"));});
  $("#topExport").onclick=exportJson;$("#topImport").onclick=pickImport;
  $("#lockBtn").onclick=function(){lockNow("已锁定。");};
  $("#impFile").addEventListener("change",function(){var f=this.files&&this.files[0];this.value="";if(!f)return;var r=new FileReader();r.onload=function(){importJsonText(String(r.result));};r.readAsText(f,"utf-8");});
  $("#fab").onclick=function(){if(S.view==="edit")addPolyp();};
  $("#ovOk").onclick=closeSheet;$("#ovX").onclick=closeSheet;
  $("#ov").addEventListener("click",function(e){if(e.target===this)closeSheet();});
  $("#ovDel").onclick=function(){var p=curPolyp();if(!p)return;if(confirm("确认删除这条息肉记录？")){S.cur.polyps=S.cur.polyps.filter(function(x){return x.id!==p.id;});closeSheet();saveSoon();refreshResults();}};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
  if(!cryptoOk()){showAuth("nocrypto");return;}
  try{await storageOpen();}catch(e){}
  showAuth(hasAuth()?"login":"setup");
  try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}
}
init();
</script>
